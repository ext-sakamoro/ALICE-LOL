# ALICE-Law G11: for each gate this crate declares pass (alice-law-conformance.toml), the checker, the
# canary it must flag, the test that fails when it compared nothing, and the shared-file rows that keep a
# shared checker identical across the crates. Read by ALICE-Law's scripts/g11_table_check.py
# (scripts/g11_table.sh fetches it at the revision .github/g11-table-pin names). The table is a
# prerequisite of G11, not its evidence: the gate cells keep their own evidence.

# G1: the library-only clippy configuration fires on every forbidden form
[[row]]
gate = "G1"
checker = "scripts/clippy_lib_gate.py"
canary = "scripts/test_clippy_lib_gate.py::Judge.test_a_missing_diagnostic_is_red"
zero = "scripts/test_clippy_lib_gate.py::Judge.test_no_forms_and_a_clean_exit_are_red"
shared = ["scripts/clippy_lib_gate.py", "scripts/test_clippy_lib_gate.py"]

# G3: no outer negation of a fused multiply-add, on the syntax tree and in the release IR
[[row]]
gate = "G3"
checker = "scripts/fneg_fma_ir_check.py"
canary = "scripts/test_fneg_fma_ir_check.py::ProbeProof.test_no_probe_run_fails"
zero = "scripts/test_fneg_fma_ir_check.py::Cli.test_a_missing_or_empty_ll_fails"
shared = ["scripts/fneg_fma_ir_check.py", "scripts/test_fneg_fma_ir_check.py"]

[[row]]
gate = "G3"
checker = "scripts/no_outer_fneg_of_fma.py"
canary = "scripts/test_no_outer_fneg_of_fma.py::Teeth.test_outer_negation_of_a_whole_mul_add_call_fails"
zero = "scripts/test_no_outer_fneg_of_fma.py::Teeth.test_zero_mul_add_calls_fails_even_with_files_present"
shared = "n/a: this crate's text-pattern pre-check; the shared syntax-tree tool is tools/no-outer-fneg-of-fma"

# G4: the geometry identifier and digest oracles, each selection run in debug and release on three targets
[[row]]
gate = "G4"
checker = ".github/workflows/ci.yml#scripts/run_tests.sh geometry_id_oracle=4,"
canary = "alice-lol/tests/golden_compare.rs::a_wrong_digest_is_refused"
zero = "scripts/test_run_tests.py::RunTests.test_a_named_file_that_ran_zero_fails"
shared = ["scripts/run_tests.sh", "scripts/test_run_tests.py"]

[[row]]
gate = "G4"
checker = ".github/workflows/ci.yml#scripts/cargo_test_nonzero.sh -p alice-lol${{ matrix.profile }} --lib geometry_id"
canary = "alice-lol/tests/geometry_id_oracle.rs::a_different_probe_set_gets_a_different_digest"
zero = "scripts/test_cargo_test_nonzero.py::CargoTestNonzero.test_a_filter_that_matches_nothing_fails"
shared = "n/a: this crate's wrapper; the shared per-binary counter is scripts/run_tests.sh"

# G5: the Law oracles under the release profile on the aarch64 runner
[[row]]
gate = "G5"
checker = "scripts/release_leg_check.py"
canary = "scripts/test_release_leg_check.py::Leg.test_release_is_required_on_each_selection"
zero = "scripts/test_release_leg_check.py::Leg.test_no_release_job_is_compared_nothing"
shared = "n/a: this crate's release workflow and its paths filter"

# G6: the semantics identifiers are the fold of their pins under the linked det-math
[[row]]
gate = "G6"
checker = "scripts/law_tests.sh#\"alice-lol|--test law_id_oracle|\""
canary = "alice-lol/tests/law_id_oracle.rs::a_different_expected_value_gets_a_different_identifier"
zero = "scripts/test_cargo_test_nonzero.py::CargoTestNonzero.test_a_filter_that_matches_nothing_fails"
shared = "n/a: this crate's identifiers"

