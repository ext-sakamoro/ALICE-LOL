# values of the `hand` argument of the intent verbs
hand = ["left", "right", "both"]

# what a program declares it is for (`units(<unit>, <purpose>, <program>)`, root only)
purpose = ["print", "render"]

# what one program unit is (`units(<unit>, ...)`): `mm` = millimetres per program unit
# a unit with no `mm` has no physical size and is declared for `render` only
# (alice_lol::units::Unit is checked against this table by tests/units_table.rs)
[[unit]]
name = "mm"
mm = 1.0

[[unit]]
name = "cm"
mm = 10.0

[[unit]]
name = "m"
mm = 1000.0

[[unit]]
name = "in"
mm = 25.4

[[unit]]
name = "world"
