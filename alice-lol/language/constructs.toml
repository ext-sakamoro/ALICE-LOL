# ALICE-LOL language definition: the constructs (one row each)
#
# This file is the source; `alice-lol/lol.gbnf` and its distribution copies are generated from it
# and `alice-lol/language/lol.gbnf.in` by `python3 scripts/gen_gbnf.py` (`--check` compares)
#
# name = the construct as written in a program
# rule = the grammar rule that accepts it (its argument shape): a `name_*` rule lists every row
#        that names it, in the order of this file; an `intent_*` rule spells its one name itself
#        in the template, and the generator checks that the row and the template agree
# args = what each number argument is, in order (optional; the generator checks its length against
#        the rule's number count): L length, I inverse length (a frequency or a rate per length),
#        A angle in degrees, C count / id / seed, R ratio (a factor or a normal component),
#        X a number whose construct has a fixed length scale of its own (it cannot be rescaled)
#        Under `units(<unit>, ...)` an L argument is in that unit; rescaling a program by k
#        multiplies the L arguments by k and divides the I arguments by k
#
# Not here: the syntax keywords `program` / `entities` and the Law lines (`audit` / `evidence` /
# `expect` / `range`), which are part of the template's fixed rules

