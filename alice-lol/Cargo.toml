[package]
name = "alice-lol"
version = "0.1.0"
edition = "2021"
description = "ALICE-LOL: Law-Oriented Language — DSL for the ALICE-SDF ecosystem"
license = "MIT OR Apache-2.0"

[dependencies]
alice-lol-macro = { path = "../alice-lol-macro" }
alice-sdf = { path = "../../ALICE-SDF", default-features = false, features = ["glsl"] }
glam = "0.29"

[dev-dependencies]
# For Phase X.8 B-5 golden parse test — validates `lol.gbnf` against the
# alice-llm GBNF parser + FSM. Promoted to a full feature-gated dep in
# B-6 (feature `llm-bridge`).
alice-llm = { path = "../../ALICE-LLM", default-features = false, features = ["grammar"] }

[features]
default = ["glsl"]
glsl = []
wgsl = ["alice-sdf/gpu"]
hlsl = ["alice-sdf/hlsl"]
physics = ["alice-sdf/physics"]
roblox = []

[[example]]
name = "basic"

[[example]]
name = "showcase"

[[example]]
name = "pruning_demo"

[[example]]
name = "law_demo"

[[example]]
name = "autodiff_demo"

[[example]]
name = "compiled_demo"

[[example]]
name = "print_demo"

[[example]]
name = "print_export"

[[example]]
name = "print_verify"

[[example]]
name = "alice_coaster"

[[example]]
name = "roblox_accessory"
required-features = ["roblox"]
