[package]
name = "alice-lol"
version = "0.5.0"
edition = "2021"
rust-version = "1.90"
description = "ALICE-LOL: Law-Oriented Language — proc_macro + runtime DSL compiling to SdfNode (GLSL/WGSL/HLSL transpile), print export (STL/3MF/OBJ/FBX), law checker, laser pattern generator, and optional LLM Guided Generation bridge."
license = "LicenseRef-Proprietary"
publish = false
authors = ["Moroya Sakamoto"]
repository = "https://github.com/ext-sakamoro/ALICE-LOL"
homepage = "https://github.com/ext-sakamoro/ALICE-LOL"
documentation = "https://docs.rs/alice-lol"
readme = "../README.md"
keywords = ["dsl", "sdf", "distance-field", "geometry", "3d-print"]
categories = ["graphics", "game-development", "mathematics"]

[dependencies]
alice-lol-macro = { path = "../alice-lol-macro", version = "0.4" }
# `layout`: the byte layout laws (a crate of its own, depending on sha2 only, so that a format
# crate such as alice-zip can check its bytes against a declaration without depending on alice-lol)
alice-lol-layout = { path = "../alice-lol-layout", version = "0.1" }
alice-sdf = { path = "../../ALICE-SDF", version = ">=7.0.0, <8", default-features = false, features = ["glsl"] }
glam = "0.29"
# `research_law` が成立範囲 / 残差統計 / 出典 / 判定閾値の型を共有する
# (no_std の `law` module だけを使うので default feature の zlib は引かない)
alice-zip = { git = "https://github.com/ext-sakamoro/ALICE-Zip", rev = "fec22a06eab879153a140b057f53f081876a2ff7", version = "0.11", default-features = false }
# research_law: transcendental functions evaluated bit-identically on every platform
# `alice-zip` (law を保存・復元する経路) と同じ世代を要求して、保存した法則と
# 評価する法則が同じ算術になるようにする
alice-det-math = "0.5.1"
# law_id: Law の識別子を作る hash (信号の法則が使っているものと同じ)
sha2 = { version = "0.10", default-features = false }
# 深い LOL tree (stdlib product の subtract 2,400 連鎖等) を parse / emit する時、
# parse_expr の大 frame × 再帰で 8 MB stack が尽きる → 再帰時に heap 上で
# stack を伸ばす (rustc と同じ手法) MIT OR Apache-2.0
stacker = "0.1"
# HMAC-SHA256 for rule laws (feature `crypto-calls`, off by default)
alice-sign = { path = "../../ALICE-Sign", version = "0.1", default-features = false, optional = true }
# Optional; only pulled in when `llm-bridge` is enabled. Exposes the
# GBNF parser + FSM + sampling helpers so downstream can drive
# grammar-constrained decoding without depending on alice-llm directly.
# alice-llm is AGPL-3.0-or-later OR LicenseRef-Commercial at the pinned version.
alice-llm = { path = "../../ALICE-LLM", version = ">=2, <4", default-features = false, features = ["grammar", "simd", "parallel"], optional = true }
# Optional; only pulled in when `physics` feature is enabled Provides
# FilamentDb / fillet_stress / beam_stress / layer_adhesion / thermal_stress
# access to stdlib::hardsurface primitives so material-backed stress checks
# can replace hardcoded const fallbacks
# alice-physics is AGPL-3.0-or-later OR LicenseRef-Commercial at the pinned version.
alice-physics = { path = "../../ALICE-Physics/crates/alice-physics", version = ">=3.0, <5", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# tests/transpiler_naga_validate.rs: corpus 全構文の WGSL / GLSL を naga で parse + validate
naga = { version = "24", default-features = false, features = ["wgsl-in", "glsl-in"] }
# tests/compile_fail.rs: `lol!` macro の compile_error! (TPMS の degenerate literal) を実際に
# rustc へ通して確かめる、`#[test]` 内では compile error を起こすとテスト binary 全体が
# ビルドできなくなるため、別プロセスで ui test を回す必要がある
trybuild = "1"
# tests/export_producer_stamp.rs: 書き出した STL / FBX を alice-sdf とは別の読み手で読む
stl_io = "0.11"
fbxcel = { version = "0.9", features = ["tree"] }

[features]
default = ["glsl"]
glsl = []
wgsl = ["alice-sdf/gpu"]
hlsl = ["alice-sdf/hlsl"]
# Physics bridge — alice-sdf 1.7.4 で一時削除、Milestone A.1.0 (2026-08-06) で復帰
# stdlib::hardsurface からも alice-physics 直接 API (FilamentDb / fillet_stress
# / beam_stress) が使えるよう alice-physics direct dep も opt-in (Phase A.3)
#
# 2026-09-13 chore: alice-sdf 1.8.0 では bridge features 群 (physics/codec/asp/font/
# cache) が crates.io publish 準備のため削除済 (alice-sdf/Cargo.toml の comment 参照)
# `alice-sdf/physics` reference は現状 dead — cargo resolver 越えのため
# dep:alice-physics のみ残す alice-sdf 側で bridge feature が復帰したら再度追加
physics = ["dep:alice-physics"]
roblox = []
# Phase X.8 B-6: exposes `alice_lol::bridge` for grammar-constrained
# LLM decoding against the LOL DSL. Off by default so pure geometry
# users don't pay for the alice-llm dep.
llm-bridge = ["dep:alice-llm"]
# `hmac_sha256` of rule laws (conformance/TASK.md "Rule laws"): alice-sign's HMAC-SHA256 and
# constant-time comparison. Off by default, so the default build and the repositories that
# take this one as a sibling need no ALICE-Sign checkout; a rule law that calls it reads in
# every build and answers `Unsupported` without the feature.
crypto-calls = ["dep:alice-sign"]

