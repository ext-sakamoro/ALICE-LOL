[package]
name = "alice-lol"
version = "0.1.0"
edition = "2021"
description = "ALICE-LOL: Law-Oriented Language — DSL for the ALICE-SDF ecosystem"
license = "MIT OR Apache-2.0"

[dependencies]
alice-lol-macro = { path = "../alice-lol-macro" }
alice-sdf = { path = "../../ALICE-SDF", default-features = false, features = ["glsl"] }
glam = "0.29"
# Optional; only pulled in when `llm-bridge` is enabled. Exposes the
# GBNF parser + FSM + sampling helpers so downstream can drive
# grammar-constrained decoding without depending on alice-llm directly.
alice-llm = { path = "../../ALICE-LLM", default-features = false, features = ["grammar"], optional = true }

[features]
default = ["glsl"]
glsl = []
wgsl = ["alice-sdf/gpu"]
hlsl = ["alice-sdf/hlsl"]
physics = ["alice-sdf/physics"]
roblox = []
# Phase X.8 B-6: exposes `alice_lol::bridge` for grammar-constrained
# LLM decoding against the LOL DSL. Off by default so pure geometry
# users don't pay for the alice-llm dep.
llm-bridge = ["dep:alice-llm"]

[[example]]
name = "basic"

[[example]]
name = "showcase"

[[example]]
name = "pruning_demo"

[[example]]
name = "law_demo"

[[example]]
name = "autodiff_demo"

[[example]]
name = "compiled_demo"

[[example]]
name = "print_demo"

[[example]]
name = "print_export"

[[example]]
name = "print_verify"

[[example]]
name = "alice_coaster"

[[example]]
name = "roblox_accessory"
required-features = ["roblox"]

# Phase X.8 B-8: end-to-end LLM → LOL DSL → SdfNode → optional STL demo
# via alice_lol::bridge::generate_sdf_from_prompt.
[[example]]
name = "prompt_to_sword"
required-features = ["llm-bridge"]
