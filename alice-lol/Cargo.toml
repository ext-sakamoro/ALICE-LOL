[package]
name = "alice-lol"
version = "0.2.0"
edition = "2021"
description = "ALICE-LOL: Law-Oriented Language — proc_macro + runtime DSL compiling to SdfNode (GLSL/WGSL/HLSL transpile), print export (STL/3MF/OBJ/FBX), law checker, laser pattern generator, and optional LLM Guided Generation bridge."
license = "MIT OR Apache-2.0"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
repository = "https://github.com/ext-sakamoro/ALICE-LOL"
homepage = "https://github.com/ext-sakamoro/ALICE-LOL"
documentation = "https://docs.rs/alice-lol"
readme = "../README.md"
keywords = ["dsl", "sdf", "distance-field", "geometry", "3d-print"]
categories = ["graphics", "game-development", "mathematics"]

[dependencies]
alice-lol-macro = { path = "../alice-lol-macro", version = "0.2.0" }
alice-sdf = { path = "../../ALICE-SDF", version = "1.7.4", default-features = false, features = ["glsl"] }
glam = "0.29"
# Optional; only pulled in when `llm-bridge` is enabled. Exposes the
# GBNF parser + FSM + sampling helpers so downstream can drive
# grammar-constrained decoding without depending on alice-llm directly.
# NOTE: alice-llm is AGPL-3.0-or-later; enabling `llm-bridge` propagates
# that license to downstream. Leave the feature off (default) to stay on
# MIT-or-Apache-2.0 terms.
alice-llm = { path = "../../ALICE-LLM", version = "1.3.0", default-features = false, features = ["grammar"], optional = true }

[features]
default = ["glsl"]
glsl = []
wgsl = ["alice-sdf/gpu"]
hlsl = ["alice-sdf/hlsl"]
# `physics` feature removed for the 0.2.0 crates.io publish because
# alice-sdf 1.7.4 temporarily dropped its `physics` bridge (blocked on
# the transitive dep chain reaching crates.io). Restore alongside
# alice-sdf 1.8.0. The src re-exports (`sdf_to_physics_field` /
# `CompiledSdfField` / `attach_physics` / `simulate_sdf` /
# `SimulatedSdf`) are `#[cfg(feature = "physics")]`-gated so they
# simply don't activate.
roblox = []
# Phase X.8 B-6: exposes `alice_lol::bridge` for grammar-constrained
# LLM decoding against the LOL DSL. Off by default so pure geometry
# users don't pay for the alice-llm dep.
llm-bridge = ["dep:alice-llm"]

[[example]]
name = "basic"

[[example]]
name = "showcase"

[[example]]
name = "pruning_demo"

[[example]]
name = "law_demo"

[[example]]
name = "autodiff_demo"

[[example]]
name = "compiled_demo"

[[example]]
name = "print_demo"

[[example]]
name = "print_export"

[[example]]
name = "print_verify"

[[example]]
name = "alice_coaster"

[[example]]
name = "roblox_accessory"
required-features = ["roblox"]

# Phase X.8 B-8: end-to-end LLM → LOL DSL → SdfNode → optional STL demo
# via alice_lol::bridge::generate_sdf_from_prompt.
[[example]]
name = "prompt_to_sword"
required-features = ["llm-bridge"]
