# Numbers the documents state, and where each one is counted (scripts/doc_numbers.py)
#
# A document writes `<!-- num: KEY -->73` next to the noun the source counts, and the gate
# recomputes KEY from the source below. A count without a marker, or a measured value without
# `<!-- measured: YYYY-MM-DD, how -->` in its block, fails.

[scan]
include = ["**/*.md"]
# CHANGELOGs record what each release had at the time; their numbers are history, not claims about now
# LICENSE files are legal text
exclude = ["CHANGELOG.md", "*/CHANGELOG.md", "LICENSE*", "*/LICENSE*"]

# ---------------------------------------------------------------- what counts as a count

[countable]
# the nouns that name something the code has a number of (case-insensitive, singular or plural)
nouns = '''constructs?|primitives?|CSG(?: op(?:eration)?s?)?|operations?|transforms?|modifiers?|print intents?|structural intents?|intents?|laws?|law files?|constraints?|variants?|verbs?|verdicts?|tests?|test files?|fuzz targets?|targets?|examples?|famil(?:y|ies)|probes?|keywords?|names|crates?|shapes?|entries|entry|types?|time controls?|stdlib shortcuts?|テスト|例|制約|動詞'''
# Japanese counters
counters = '''個|種類?|件|本|名'''
# a number right after these is an ordinal, not a count ("Phase 2 Law", "Level 1", "form 3")
ignore_before = '''Phase|Level|form|step|Track|v'''

# ---------------------------------------------------------------- measured values

[measured]
# a value after a comparison ("≤ 10ns", "> 10KB") or before 未満 / 以下 / "+" is a limit, not a measurement
bound_before = '''≤|<=|<|≥|>=|>'''
bound_after = '''未満|以下|以上|\+'''
# time, throughput and sizes of what the code produces; physical dimensions (mm, kgf, %) of printed parts
# are design inputs, not measurements of the code
units = '''(?:ns|µs|us|ms)(?:/point)?\b|s\b(?!\w)|k?\s*(?:samples|frames|tokens)(?:/s\b|\s+per\s+second\b)|fps\b|(?:triangles|tris)\b|(?:KB|MB|GB)\b|lines\b|x\s+(?:faster|slower|smaller|larger)\b|%\s+(?:smaller|faster|slower|larger|(?:DSL size|mesh|size)\s+reduction)'''

# ---------------------------------------------------------------- sources

[sources."syntax.primitives"]
noun = '''primitive'''
kind = "strings_in_block"
file = "alice-lol/src/syntax_table.rs"
block = '''\(\s*"primitives",\s*&\[(.*?)\]'''

[sources."syntax.csg"]
noun = '''CSG|operation'''
kind = "strings_in_block"
file = "alice-lol/src/syntax_table.rs"
block = '''\(\s*"csg",\s*&\[(.*?)\]'''

[sources."syntax.transforms"]
noun = '''transform'''
kind = "strings_in_block"
file = "alice-lol/src/syntax_table.rs"
block = '''\(\s*"transforms",\s*&\[(.*?)\]'''

[sources."syntax.modifiers"]
noun = '''modifier'''
kind = "strings_in_block"
file = "alice-lol/src/syntax_table.rs"
block = '''\(\s*"modifiers",\s*&\[(.*?)\]'''

[sources."syntax.print"]
noun = '''print|TPMS'''
kind = "strings_in_block"
file = "alice-lol/src/syntax_table.rs"
block = '''\(\s*"print",\s*&\[(.*?)\]'''

[sources."syntax.time"]
noun = '''time|時間'''
kind = "strings_in_block"
file = "alice-lol/src/syntax_table.rs"
block = '''\(\s*"time",\s*&\[(.*?)\]'''

[sources."syntax.stdlib"]
noun = '''stdlib'''
kind = "strings_in_block"
file = "alice-lol/src/syntax_table.rs"
block = '''\(\s*"stdlib",\s*&\[(.*?)\]'''

[sources."syntax.core"]
# the language without the stdlib shortcuts
noun = '''construct|total'''
kind = "sum"
of = ["syntax.primitives", "syntax.csg", "syntax.transforms", "syntax.modifiers", "syntax.print", "syntax.time"]

[sources."syntax.all"]
noun = '''construct|stdlib|grammar'''
kind = "sum"
of = ["syntax.core", "syntax.stdlib"]

[sources."syntax.intent"]
noun = '''intent|construct'''
kind = "strings_in_block"
file = "alice-lol/src/syntax_table.rs"
block = '''const INTENT_SYNTAX[^=]*=\s*&\[(.*?)\];'''

[sources."law.constraints"]
noun = '''Constraint|制約|laws?\b'''
kind = "rust_enum_variants"
file = "alice-lol/src/law.rs"
name = "Constraint"

[sources."verdict.audit"]
noun = '''verdict'''
kind = "rust_enum_variants"
file = "alice-lol/src/audit_law.rs"
name = "Verdict"

[sources."intent.variants"]
noun = '''IntentNode|Intent'''
kind = "rust_enum_variants"
file = "alice-lol/src/intent.rs"
name = "IntentNode"

[sources."intent.composites"]
noun = '''合成|composite'''
kind = "distinct_matches"
file = "alice-lol/src/intent.rs"
pattern = '''(?m)^    (Sequence|Parallel)\('''

[sources."intent.other"]
# the variants that are neither an L1 physical verb nor a composite
noun = '''L1 以外|LatentIntent'''
kind = "distinct_matches"
file = "alice-lol/src/intent.rs"
pattern = '''(?m)^    (LatentIntent|Music)\b'''

[sources."intent.l1_verbs"]
noun = '''verb'''
kind = "sum"
of = ["intent.variants"]
minus = ["intent.composites", "intent.other"]

[sources."sdf.variants"]
# every SdfNode variant emit::to_lol names (the emitter matches all of them, no wildcard arm)
noun = '''SdfNode'''
kind = "distinct_matches"
file = "alice-lol/src/emit.rs"
pattern = '''SdfNode::([A-Z][A-Za-z0-9]*)'''

[sources."tests.law"]
noun = '''law_tests|テスト'''
kind = "rust_test_fns"
file = "alice-lol/tests/law_tests.rs"

[sources."fuzz.targets"]
noun = '''target'''
kind = "glob"
glob = "fuzz/fuzz_targets/*.rs"

[sources."datagen.families"]
noun = '''famil'''
kind = "rust_enum_variants"
file = "alice-lol-datagen/src/families/mod.rs"
name = "Family"

[sources."ci.test_entries"]
# the matrix entries of the Test job in ci.yml
noun = '''entries|Test'''
kind = "strings_in_block"
file = ".github/workflows/ci.yml"
block = '''^  test:\n.*?\n        include:\n(.*?)\n    steps:'''
item = '''(?m)^          - os:'''

