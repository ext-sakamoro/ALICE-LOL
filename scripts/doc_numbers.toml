# ---------------------------------------------------------------- counts that are plans, operands or outside facts

[[allow]]
file = "SPEC.md"
text = "| 4 | テスト 7件 + showcase 更新 |"
reason = "a step of the v0.x implementation plan (what that step was to add), not the current test count"

[[allow]]
file = "SPEC.md"
text = "新 5 variant (Stress / Thermal / Contact / Continuity / VolumeConservation)"
reason = "the five variants the A.2 sprint added, named in the same sentence"

