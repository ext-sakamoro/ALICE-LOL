# scripts/id_move_check.py (ALICE-Law G9): the identifiers whose value may move only with a
# breaking version, the previous-identifier lists that must keep the released value (none yet:
# PREVIOUS_LOL_* do not exist, so a moved identifier needs the breaking version), and the
# release tags the base is read from (its values come from the published crate)
package = "alice-lol"
manifest = "alice-lol/Cargo.toml"
tags = ["alice-lol-v{version}"]

[exempt]
LAW_ID_DOMAIN = "alice-zip's domain-separation tag for law identifiers, re-exported (bytes, not an identifier of what was computed); it is hashed into every per-law identifier, and its own history is alice-zip's"

[[id]]
path = "alice_lol::law_id::LOL_SEMANTICS_ID"

[[id]]
path = "alice_lol::geometry_id::LOL_GEOMETRY_SEMANTICS_ID"

# the primary identifier LOL's exports (STL / 3MF / FBX) write: alice-sdf's mesh meaning, the bytes LOL writes
[[id]]
path = "alice_lol::print_export::LOL_EXPORT_PRIMARY_SEMANTICS_ID"

# the identifier of what lol! expands to that this alice-lol accepts (ALICE-Law G7): a different
# expansion can change what a program written with lol! means, so it moves only with a breaking version
[[id]]
path = "alice_lol::macro_id::EXPECTED_MACRO_EXPANSION_ID"

# the semantics of the rule laws (kind machine / predicate): the fold of RULE_SEMANTICS_PINS, measured from
# the behaviour of rule_law; it is in every rule-law identifier, so it moves only with a breaking version
[[id]]
path = "alice_lol::rule_law::RULE_SEMANTICS_ID"

# the semantics of the layout laws (kind layout): the fold of LAYOUT_SEMANTICS_PINS, measured from the
# behaviour of alice-lol-layout and re-exported here; it is in every layout-law identifier, so it moves
# only with a breaking version
[[id]]
path = "alice_lol::layout::LAYOUT_SEMANTICS_ID"
