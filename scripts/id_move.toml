# scripts/id_move_check.py (ALICE-Law G9): the identifiers whose value may move only with a
# breaking version, the previous-identifier lists that must keep the released value (none yet:
# PREVIOUS_LOL_* do not exist, so a moved identifier needs the breaking version), and the
# release tags the base is read from (its values come from the published crate)
package = "alice-lol"
manifest = "alice-lol/Cargo.toml"
tags = ["alice-lol-v{version}"]

[exempt]
LAW_ID_DOMAIN = "alice-zip's domain-separation tag for law identifiers, re-exported (bytes, not an identifier of what was computed); it is hashed into every per-law identifier, and its own history is alice-zip's"

[[id]]
path = "alice_lol::law_id::LOL_SEMANTICS_ID"
previous = "alice_lol::law_id::PREVIOUS_LOL_SEMANTICS_IDS"
previous-tests = ["tests/semantics_id_per_det_math.rs::the_previous_list_is_the_rows_det_math_verifies_as_the_same_bits", "tests/semantics_id_per_det_math.rs::the_0_4_1_identifier_is_verified_previous"]

[[id]]
path = "alice_lol::geometry_id::LOL_GEOMETRY_SEMANTICS_ID"
previous = "alice_lol::geometry_id::PREVIOUS_LOL_GEOMETRY_SEMANTICS_IDS"
previous-tests = ["tests/geometry_semantics_per_det_math.rs::the_previous_list_is_the_rows_det_math_verifies_as_the_same_bits", "tests/geometry_semantics_per_det_math.rs::the_0_4_1_geometry_identifier_is_verified_previous"]

# the primary identifier LOL's exports (STL / 3MF / FBX) write: alice-sdf's mesh meaning, the bytes LOL writes
[[id]]
path = "alice_lol::print_export::LOL_EXPORT_PRIMARY_SEMANTICS_ID"

# the identifier of what lol! expands to that this alice-lol accepts (ALICE-Law G7): a different
# expansion can change what a program written with lol! means, so it moves only with a breaking version
[[id]]
path = "alice_lol::macro_id::EXPECTED_MACRO_EXPANSION_ID"

# the semantics of the rule laws (kind machine / predicate): the fold of RULE_SEMANTICS_PINS, measured from
# the behaviour of rule_law; it is in every rule-law identifier, so it moves only with a breaking version
[[id]]
path = "alice_lol::rule_law::RULE_SEMANTICS_ID"

# the semantics of the table laws (kind table): the fold of TABLE_SEMANTICS_PINS (the order of the rows,
# measured from the behaviour of rule_law, and RULE_SEMANTICS_ID); it is in every table-law identifier, so
# it moves only with a breaking version
[[id]]
path = "alice_lol::rule_law::TABLE_SEMANTICS_ID"

# the semantics of the rule laws with money (a `currencies` line): MONEY_SEMANTICS_ID (a predicate) is the
# fold of MONEY_SEMANTICS_PINS (money measured from the behaviour of rule_law, and RULE_SEMANTICS_ID),
# MONEY_TABLE_SEMANTICS_ID (a table) the fold of the table's row order and MONEY_SEMANTICS_ID; they are in
# every identifier of a law with money, so they move only with a breaking version
[[id]]
path = "alice_lol::rule_law::MONEY_SEMANTICS_ID"

[[id]]
path = "alice_lol::rule_law::MONEY_TABLE_SEMANTICS_ID"

# the semantics of the legal kinds: STATUTE_SEMANTICS_ID (kind statute, the clauses in force at a time),
# PROCEDURE_SEMANTICS_ID (kind procedure, a machine over a procedure's statuses and step kinds, and
# RULE_SEMANTICS_ID) and CONTRACT_SEMANTICS_ID (kind contract, its status and what it owes, and
# MONEY_SEMANTICS_ID), each the fold of its pins measured from the behaviour of rule_law; each is in every
# identifier of its kind, so it moves only with a breaking version
[[id]]
path = "alice_lol::rule_law::STATUTE_SEMANTICS_ID"

[[id]]
path = "alice_lol::rule_law::PROCEDURE_SEMANTICS_ID"

[[id]]
path = "alice_lol::rule_law::CONTRACT_SEMANTICS_ID"

# the semantics of the layout laws (kind layout): the fold of LAYOUT_SEMANTICS_PINS, measured from the
# behaviour of alice-lol-layout and re-exported here; it is in every layout-law identifier, so it moves
# only with a breaking version
[[id]]
path = "alice_lol::layout::LAYOUT_SEMANTICS_ID"

# the semantics of the motion laws (kind motion): the fold of MOTION_SEMANTICS_PINS, measured from the
# behaviour of motion_law; it is in every motion-law identifier, so it moves only with a breaking version
[[id]]
path = "alice_lol::motion_law::MOTION_SEMANTICS_ID"

# the reference raster of a moving word (motion_frame): the fold of FRAME_SEMANTICS_PINS, measured from
# the raster; it is the first thing every frame hash hashes, so it moves only with a breaking version
[[id]]
path = "alice_lol::motion_frame::FRAME_SEMANTICS_ID"

# the series quantities of audit laws (x-series): the fold of AUDIT_SERIES_SEMANTICS_PINS, in the
# identifier of every audit law that declares a series, so it moves only with a breaking version
[[id]]
path = "alice_lol::law_input::AUDIT_SERIES_SEMANTICS_ID"
