[package]
name = "clippy-lib-canary"
version = "0.0.0"
publish = false
license = "LicenseRef-Proprietary"
edition = "2021"
description = "Calls every form .github/clippy-lib/clippy.toml forbids, so scripts/clippy_lib_gate.py can show the lint fires"

# a fixture of the scripts, not part of the alice-lol package
[workspace]

[dependencies]
glam = "0.29"
alice-sdf = { git = "https://github.com/ext-sakamoro/ALICE-SDF", branch = "main", version = "7", default-features = false, features = ["glsl", "gpu", "hlsl"] }  # generated by scripts/sdf_writers.py --write
