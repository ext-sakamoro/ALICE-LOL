[package]
name = "clippy-lib-canary"
version = "0.0.0"
publish = false
license = "Apache-2.0"
edition = "2021"
description = "Calls every form .github/clippy-lib/clippy.toml forbids, so scripts/clippy_lib_gate.py can show the lint fires"

# a fixture of the scripts, not part of the alice-lol package
[workspace]

[dependencies]
glam = "0.29"
alice-sdf = { path = "../../../ALICE-SDF", default-features = false, features = ["glsl", "gpu", "hlsl"] }  # generated by scripts/sdf_writers.py --write
