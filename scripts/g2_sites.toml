# scripts/g2_sites.py (ALICE-Law G2): every library function that calls the Law max / min
# (det_math::max / min / max64 / min64, det_vec), with the number of calls, and how their ties are
# settled: `tests` (bit-level tie tests through the public API) and / or `reason` (why the zero
# sign or a NaN operand cannot be observed there). The Law helpers give +0 from max and -0 from min
# for an equal pair of zeros in either order and the other operand for a NaN; the platform forms
# leave both unspecified. `python3 scripts/g2_sites.py --list` prints the sites found.

[[site]]
file = "alice-lol/src/laser_pattern.rs"
fn = "density_hatch"
calls = 2
tests = ["alice-lol/tests/law_max_min_ties.rs::density_hatch_first_line_takes_the_law_min_of_mixed_zero_projections"]
reason = "the max fold (proj_max) only bounds the loop `d <= proj_max`, a comparison; the min fold starts from +inf so a NaN is never its first operand, and a NaN second operand gives the other operand under the Law and the platform alike"

[[site]]
file = "alice-lol/src/laser_pattern.rs"
fn = "hatch"
calls = 2
reason = "proj_min only reaches the lines through d0 = ceil(proj_min / spacing) * spacing and d = i * spacing + d0, where 0 * spacing + d0 is +0 for d0 = ±0; proj_max only counts the lines (an integer); the folds start from ±inf, so a NaN is never the first operand"

[[site]]
file = "alice-lol/src/law.rs"
fn = "check_non_overlap"
calls = 2
reason = "the evidence ranking max(fa, fb) runs only when fa < 0 and fb < 0 (no zero, no NaN); the depth fold min over surface distances takes lengths (never -0) from +inf, and a NaN distance gives the other operand under the Law and the platform alike"

[[site]]
