fn = "contact_upper_bound"
calls = 1
reason = "radius = max(max_distance, min_distance) + cell_diag with cell_diag a length (>= +0, +0 for a flat box), and x + (+0) is +0 for x = ±0, so the zero sign is erased; a NaN max_distance gives min_distance under the Law and the platform alike"

[[site]]
