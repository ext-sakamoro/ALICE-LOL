calls = 2
reason = "the tightened bounds are only compared (lo > hi, interval_sign, decided_ok's ia.lo >= 0 / io.hi <= 0, tight.lo > 0), where -0 and +0 compare equal; a NaN interval bound gives the enclosure's bound, which lipschitz_enclosure has checked finite"

[[site]]
file = "alice-lol/src/law.rs"
fn = "solve_peak_temperature"
calls = 2
reason = "dt = min(dt_max * 0.5, duration_s): the caller refuses duration_s <= 0 or NaN (law.rs check_thermal_field), and dt_max is finite and > 0; the peak fold max over material cells reaches TemperatureUnbracketed { lo_c, hi_c } only when lo_c <= limit < hi_c, but a zero peak needs no positive source in the material, which makes hi_c equal to lo_c, so a zero peak never reaches it; in the violation residual limit - lo_c the zero sign is erased"

