# Every public entry point of alice-lol that takes text, bytes or a reader (scripts/g7_boundaries.py, ALICE-Law G7)
#
# class: exchange (reads what another program or release wrote; the identifier is required and compared,
#        `test` names the test that feeds another identifier), authoring (reads source a person or a model
#        writes; the identifier wrapper is optional and compared when present), local (carries no
#        Law-bearing value of another crate)
# `python3 scripts/g7_boundaries.py --list` prints the entry points found

[[macro]]
crate = "alice-lol-macro"
compared_in = "alice-lol/src/macro_id.rs"
paired_by = "scripts/g7_macro_pairing.py"

