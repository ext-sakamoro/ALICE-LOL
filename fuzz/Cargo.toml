[package]
name = "alice-lol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
alice-lol = { path = "../alice-lol", default-features = false, features = ["glsl", "wgsl", "hlsl"] }
glam = "0.29"

[[bin]]
name = "fuzz_lol_parse"
path = "fuzz_targets/fuzz_lol_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_lol_to_wgsl"
path = "fuzz_targets/fuzz_lol_to_wgsl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_lol_eval"
path = "fuzz_targets/fuzz_lol_eval.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
