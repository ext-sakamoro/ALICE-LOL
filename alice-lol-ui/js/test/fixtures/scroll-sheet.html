<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll sheet</title>
<style>
  /* a stage with a list sheet over it and a control bar below the stage: the sheet scrolls, so a
     card can sit half past its bottom edge, above the bar's controls */
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; font: 16px sans-serif; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #select { position: absolute; inset: 0; display: grid; place-items: center; }
  .sheet { width: calc(100% - 32px); max-height: calc(100% - 32px); overflow: auto; padding: 16px; box-sizing: border-box; }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; }
  #cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
  #cards button { height: 140px; font-size: 16px; }
  /* the two cards made to overlap (the `overlap` state): the card half past the edge pulled up
     over the one above it */
  body.overlap #cards button:nth-child(5) { margin-top: -60px; }
  #bar { display: flex; gap: 8px; padding: 8px; align-items: center; }
  #bar button { width: 48px; height: 48px; }
  #scrub { flex: 1; height: 24px; }
</style>
</head>
<body>
<div id="stage">
  <div id="select">
    <div class="sheet">
      <h2>Stages</h2>
      <div id="cards">
        <button>1</button><button>2</button><button>3</button><button>4</button>
        <button>5</button><button>6</button><button>7</button><button>8</button>
      </div>
    </div>
  </div>
</div>
<div id="bar">
  <button id="back">&lt;</button><button id="play">&gt;</button>
  <input id="scrub" type="range" min="0" max="100">
  <button id="fwd">&gt;&gt;</button>
</div>
</body>
</html>
