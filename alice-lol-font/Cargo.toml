[package]
name = "alice-lol-font"
version = "0.1.0"
edition = "2021"
description = "Font template for ALICE-LOL DSL — parametric glyph + Bezier stroke → SdfNode. Foundry outline embed via opt-in AGPL feature."
license = "MIT OR Apache-2.0"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
repository = "https://github.com/ext-sakamoro/ALICE-LOL"
homepage = "https://github.com/ext-sakamoro/ALICE-LOL"
documentation = "https://docs.rs/alice-lol-font"
readme = "../README.md"
keywords = ["dsl", "sdf", "font", "typography", "glyph"]
categories = ["graphics", "game-development", "text-processing"]

[dependencies]
alice-sdf = { path = "../../ALICE-SDF", version = "1.7.4", default-features = false }
glam = "0.29"

# Opt-in AGPL cascade — 有効化すると ALICE-Foundry 経由で BIZ UDPGothic
# 3344 CJK outline + Foundry procedural render pipeline が使えるが、下流全体が
# AGPL-3.0-or-later に切り替わる 商用 license 保有者以外での有効化は非推奨
# Phase 1-8 で foundry.rs module に実装追加予定、それまで src で参照されない
# (cargo-machete は unused false-positive で報告するため metadata.ignored に登録)
alice-foundry = { path = "../../ALICE-Foundry", version = "0.1", default-features = false, features = ["lol"], optional = true }

[features]
default = ["parametric"]
# MIT/Apache pure — 独自 stroke → Sdf2dNode 実装、Foundry 無依存
parametric = []
# Opt-in AGPL cascade — Foundry lol_bridge 経由
foundry = ["dep:alice-foundry"]

# alice-foundry は Phase 1-8 実装まで src で参照されない (optional dep 宣言のみ)
[package.metadata.cargo-machete]
ignored = ["alice-foundry"]
