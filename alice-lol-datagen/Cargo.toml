[package]
name = "alice-lol-datagen"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Synthetic (caption, LOL) pair generator for ALICE-LOL — template families emit LOL text, bilingual captions and oracle points from the same parameters (Track C1)."
license = "LicenseRef-Proprietary"
authors = ["Moroya Sakamoto"]
repository = "https://github.com/ext-sakamoro/ALICE-LOL"
homepage = "https://github.com/ext-sakamoro/ALICE-LOL"
readme = "README.md"
keywords = ["dsl", "sdf", "dataset", "synthetic", "llm"]
categories = ["graphics", "science"]
publish = false

[dependencies]
alice-lol = { path = "../alice-lol", version = "0.5.0", default-features = false }
glam = "0.29"

[features]
default = []
# `Fsm::accepts_str` で LLM grammar 受理を self-check に含める (alice-llm を引く、pin の版の alice-llm は AGPL-3.0-or-later OR LicenseRef-Commercial)
grammar-check = ["alice-lol/llm-bridge"]

[[bin]]
name = "datagen"
path = "src/bin/datagen.rs"
