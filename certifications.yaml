# certifications.yaml — LOL pattern の実地テスト record (Phase D.3 skeleton)
#
# Purpose: alice_lol::stdlib::pattern::registry の各 pattern に紐づく実プリント
# 実測記録を YAML 形式で管理 Phase B.2 で user が実測データを埋める
#
# Schema (各 entry):
#   pattern_name: registry の LolPattern.name (snake_case)
#   field_test:
#     date:     ISO 8601 (YYYY-MM-DD)
#     material: PLA / PETG / ABS / Nylon / TPU
#     printer:  Bambu H2D / Bambu P1S / Bambu A1 mini
#     notes:    free-form (実プリント時の観察点、成果物写真 URL 等)
#   printability_score:  0-100 (Bamboo PrintabilityScore で計算、任意)
#
# 現状 (2026-08-06 Phase D.3 skeleton): 全 entry TBD (Phase B.2 で埋める)
# entry 追加時は registry (src/stdlib/pattern.rs) の対応 pattern の
# `certified_by = UserFieldTest` + `field_test = Some(FieldTestRecord { ... })` に反映
#
# 参照: docs/BAMBU_STUDIO_VERIFICATION.md (Phase 5.6 手順書)
#       ~/.claude/projects/-Users-ys/memory/reference_bambu_3mf_analyzed_assets.md

