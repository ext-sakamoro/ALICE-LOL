# certifications.yaml — LOL pattern の実地テスト record (Phase B.2 代替 + D.3)
#
# Purpose: alice_lol::stdlib::pattern::registry の各 pattern に紐づく実プリント
# 実測記録を YAML 形式で管理 Phase B.2 で user が実測データを埋める、
# Phase B.2 代替 (2026-08-06) で Bamboo simulation score を追加反映
#
# Schema (各 entry):
#   pattern_name: registry の LolPattern.name (snake_case)
#   field_test:
#     date:     ISO 8601 (YYYY-MM-DD、Bamboo `models/` .3mf 生成日、実プリント無しなら null)
#     material: PLA / PETG / ABS / Nylon / TPU
#     printer:  Bambu H2D / Bambu P1S / Bambu A1 mini
#     notes:    free-form (実プリント時の観察点、成果物写真 URL 等)
#   printability_score:  0-100 (Bamboo `examples/compute_pattern_scores.rs` で実測、
#                        resolution 96、material 指定、min_wall_thickness_mm + support_ratio spec 由来)
#   certified_by:  UserFieldTest / BambooSimulation / Both / None (registry と同期)
#   sim_axes:  {overhang, min_thickness, warp, support, stress} の 5 軸 score (0-100)
#              (詳細は `~/ALICE-Bamboo/pattern_scores.json` 参照)
#   passes_ci_gate: score >= 85 OR certified_by が UserFieldTest 含む (pattern.rs 判定と一致)
#
# 実測反映: 2026-08-06 Bamboo simulation で全 13 pattern score 算出、
# UserFieldTest baseline 10 pattern は Both/UserFieldTest 維持、未検証 3 pattern は
# BambooSimulation に昇格 (gridfinity_bin は Sim 97 で gate 通過、wall_hook / drawer_organizer は
# Sim < 85 で gate 未通過)
#
# 参照: docs/BAMBU_STUDIO_VERIFICATION.md (Phase 5.6 手順書)
#       ~/ALICE-Bamboo/examples/compute_pattern_scores.rs (Bamboo simulation runner)
#       ~/ALICE-Bamboo/pattern_scores.json (実測 JSON dump)

