name: 'ALICE-LOL Optional Bridge Stubs'
description: |
  Create empty stub crates for the ALICE-LOL sibling path deps
  (alice-sdf / alice-llm / alice-physics / alice-foundry). alice-sdf は mandatory
  (glsl feature)、他 3 crate は optional feature (llm-bridge / physics / foundry) 用。

  Canonical CI template: [[reference_alice_ci_canonical_template]]

  license = "MIT OR Apache-2.0" 必須 (canonical 罠 #2、cargo-deny "unlicensed" reject 予防)

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        # ALICE-SDF stub (mandatory dep、`glsl` feature 有効化前提)
        mkdir -p "../ALICE-SDF/src"
        cat > "../ALICE-SDF/Cargo.toml" <<'TOML'
        [package]
        name = "alice-sdf"
        version = "1.7.4"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [features]
        default = ["glsl"]
        glsl = []
        gpu = []
        hlsl = []
        physics = []

        [lib]
        path = "src/lib.rs"
        TOML
        : > "../ALICE-SDF/src/lib.rs"

        # ALICE-LLM stub (llm-bridge feature 用、実 crate は AGPL-3.0-or-later)
        # stub は CI 内 fake、実 license は反映しない (permissive で cargo-deny 通過)
        mkdir -p "../ALICE-LLM/src"
        cat > "../ALICE-LLM/Cargo.toml" <<'TOML'
        [package]
        name = "alice-llm"
        version = "1.3.0"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [features]
        default = []
        grammar = []

        [lib]
        path = "src/lib.rs"
        TOML
        : > "../ALICE-LLM/src/lib.rs"

        # ALICE-Physics stub (physics feature 用、実 crate は AGPL-3.0)
        mkdir -p "../ALICE-Physics/src"
        cat > "../ALICE-Physics/Cargo.toml" <<'TOML'
        [package]
        name = "alice-physics"
        version = "0.12.0"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [features]
        default = ["std"]
        std = []

        [lib]
        path = "src/lib.rs"
        TOML
        : > "../ALICE-Physics/src/lib.rs"

        # ALICE-Foundry stub (現状 public workspace 内に foundry 依存 crate なし、
        # future の foundry feature 用 crate 追加時のための予備 stub、
        # 実 crate は AGPL-3.0-or-later dual license)
        # 注: alice-lol-font は 2026-09-09 に private repo (ext-sakamoro/alice-lol-font) に分離済
        mkdir -p "../ALICE-Foundry/src"
        cat > "../ALICE-Foundry/Cargo.toml" <<'TOML'
        [package]
        name = "alice-foundry"
        version = "0.1.0"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [features]
        default = []
        lol = []

        [lib]
        path = "src/lib.rs"
        TOML
        : > "../ALICE-Foundry/src/lib.rs"

        # ALICE-Kinematics stub (alice-lol-robot の kinematics feature 経由、
        # 実 crate は MIT (encoder feature のみ AGPL-3.0))
        # cargo audit / deny / machete 用の manifest-only stub
        mkdir -p "../ALICE-Kinematics/src"
        cat > "../ALICE-Kinematics/Cargo.toml" <<'TOML'
        [package]
        name = "alice-kinematics"
        version = "0.1.0"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [features]
        default = []
        std = []
        encoder = []
        lol = []

        [lib]
        path = "src/lib.rs"
        TOML
        : > "../ALICE-Kinematics/src/lib.rs"

        echo "Created stubs: alice-sdf / alice-llm / alice-physics / alice-foundry / alice-kinematics (all with license = MIT OR Apache-2.0)"
