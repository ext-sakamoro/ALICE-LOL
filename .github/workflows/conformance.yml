name: Conformance

# The conformance corpus, end to end: generate it from laws/spike (mpmath), check that it
# covers every corner, score the reference implementation on it and on every probe
# (score.sh --kind reader), then run the must-red controls (controls.sh). The corpus has a
# floor of vectors (MIN_VECTORS): an empty or shrunken corpus fails instead of scoring
# nothing.

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/conformance.txt)
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - 'conformance/**'
      - 'laws/**'
      - 'scripts/law_*.py'
      - 'scripts/changed_paths.py'
      - '.github/workflows/conformance.yml'
      - '.github/workflows/ci.yml'
      - '.github/paths/conformance.txt'
  workflow_dispatch:

# the job reads the repository only
permissions:
  contents: read

# a superseded run on a branch is cancelled; on main each commit has a group of its own
# and is never cancelled (a cancelled main commit is unverified)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/conformance.txt

  corpus:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Conformance corpus (score + controls)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 392 vectors on 2026-10-11; raise it when laws or cases are added
      MIN_VECTORS: 392
      JOBS: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: conformance requirements (mpmath, pinned)
        run: python -m pip install -r conformance/requirements.txt
      - name: score the reference implementation (corpus + probes, kind reader)
        run: conformance/score.sh --kind reader python conformance/ref_impl.py
        env:
          PYTHON: python
      - name: must-red controls
        run: conformance/controls.sh
        env:
          PYTHON: python

  # one result for the workflow: run=true needs every job above to succeed, run=false needs
  # them skipped (a skipped, cancelled or failed job after run=true is red)
  gate:
    name: Gate
    if: always()
    needs: [changes, corpus]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
