name: Grid teeth check

# Weekly on a schedule, not per-ordinary-push: scripts/grid_teeth_check.sh
# reintroduces 5 historical regressions as mutants (one at a time, directly
# in this checkout) and asserts the degenerate-parameter grid test or a
# named unit test turns red for each -- each mutant rebuilds the probe
# binary and reruns the full grid (~90s), so 5 mutants is roughly 10
# minutes, far more than a per-push gate should cost for every push.
#
# A path-filtered push trigger covers the one case that actually needs
# per-push confirmation: a change to the grid itself, the probe, the shared
# corpus, this workflow, or the check script. `workflow_dispatch` can only
# target a workflow that already exists on the default branch (confirmed:
# dispatching this file from a feature branch before it lands 404s --
# "workflow ... not found on the default branch"), so a push-triggered run
# is the only way to prove this file's own teeth before landing it; a
# push-triggered workflow runs the version of itself on the pushed branch,
# unlike workflow_dispatch.

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/grid-teeth-check.txt)
    branches: [main, 'ci/**']
  schedule:
    - cron: '30 3 * * 1' # Mondays 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read

# a superseded run on a branch is cancelled; on main each commit has a group of its own
# and is never cancelled (matches ci.yml's convention) the weekly/manual triggers aren't
# ref-specific pushes, so they get their own group per run (github.run_id) rather than
# colliding with -- or being cancelled by -- a push-triggered run on some branch
concurrency:
  group: grid-teeth-check-${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' && github.sha || github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/grid-teeth-check.txt

  grid-teeth-check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Grid teeth check (5 historical-regression mutants)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Kinematics
          path: ALICE-Kinematics
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Physics
          path: ALICE-Physics

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      - name: grid_teeth_check (M1-M5, each mutant must turn its target red)
        working-directory: ALICE-LOL
        run: bash scripts/grid_teeth_check.sh

  # one result for the workflow: run=true needs every job above to succeed, run=false needs
  # them skipped (a skipped, cancelled or failed job after run=true is red)
  gate:
    name: Gate
    if: always()
    needs: [changes, grid-teeth-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
