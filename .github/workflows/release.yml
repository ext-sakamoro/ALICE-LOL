name: Release

on:
  push:
    tags:
      - 'alice-lol-v*.*.*'
      - 'alice-lol-macro-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. alice-lol-v0.4.0 or alice-lol-macro-v0.3.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-crate:
    name: Detect crate from tag
    runs-on: ubuntu-latest
    outputs:
      crate: ${{ steps.parse.outputs.crate }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ "$TAG" == alice-lol-macro-v* ]]; then
            echo "crate=alice-lol-macro" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#alice-lol-macro-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == alice-lol-v* ]]; then
            echo "crate=alice-lol" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#alice-lol-v}" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown tag format: $TAG" >&2
            exit 1
          fi

  dry-run-publish:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    needs: detect-crate
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: dry-run-${{ needs.detect-crate.outputs.crate }}

      # Path deps carry `version = "..."`, so cargo publish substitutes them
      # with the crates.io registry copy at package time; no sibling checkout
      # is needed for --dry-run.
      - name: cargo publish --dry-run
        working-directory: ${{ needs.detect-crate.outputs.crate }}
        run: cargo publish --dry-run

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [detect-crate, dry-run-publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract CHANGELOG excerpt
        id: changelog
        shell: bash
        run: |
          VERSION="${{ needs.detect-crate.outputs.version }}"
          CRATE="${{ needs.detect-crate.outputs.crate }}"
          # Prefer per-crate CHANGELOG.md if it exists; fall back to workspace root.
          if [[ -f "$CRATE/CHANGELOG.md" ]]; then
            FILE="$CRATE/CHANGELOG.md"
          else
            FILE="CHANGELOG.md"
          fi
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (match($0, /\[[^]]+\]/)) {
                tag = substr($0, RSTART+1, RLENGTH-2)
                if (tag == ver) { in_section=1; print; next }
                if (in_section) { exit }
              }
            }
            in_section { print }
          ' "$FILE" > release_notes.md || true
          if [[ ! -s release_notes.md ]]; then
            echo "See CHANGELOG.md for details." > release_notes.md
          fi
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ needs.detect-crate.outputs.crate }} ${{ needs.detect-crate.outputs.version }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          draft: false
          prerelease: false
