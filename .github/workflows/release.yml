name: Release

on:
  push:
    tags:
      - 'alice-lol-v*.*.*'
      - 'alice-lol-macro-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. alice-lol-v0.4.0 or alice-lol-macro-v0.3.0)'
        required: true
        type: string
      ref:
        description: 'Commit (full 40-character SHA), branch or tag to check out instead of the tag (to try a release before its tag exists); empty = the tag'
        required: false
        type: string
        default: ''
      release:
        description: 'Create the GitHub Release (false = only the dry-run publish); only when ref is empty and the tag exists'
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-crate:
    name: Detect crate from tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      crate: ${{ steps.parse.outputs.crate }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" == alice-lol-macro-v* ]]; then
            echo "crate=alice-lol-macro" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#alice-lol-macro-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == alice-lol-v* ]]; then
            echo "crate=alice-lol" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#alice-lol-v}" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown tag format: $TAG" >&2
            exit 1
          fi

  dry-run-publish:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect-crate
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          path: ALICE-LOL

      # the sibling tool comes from this workflow's own commit: a tag made before the tool
      # existed does not contain it
      - uses: actions/checkout@v5
        with:
          path: release-tools
          sparse-checkout: scripts/release_siblings.py
          sparse-checkout-cone-mode: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: dry-run-${{ needs.detect-crate.outputs.crate }}
          workspaces: ALICE-LOL

      # cargo reads the manifest of every workspace member before it publishes, and the
      # members depend on sibling repositories by path (`../../ALICE-SDF`), so the dry run
      # needs them next to this checkout. Each sibling is the tag of the version in this
      # commit's Cargo.lock (scripts/release_siblings.py), not the sibling's main branch.
      - name: Check out the siblings at the locked versions
        shell: bash
        run: |
          set -euo pipefail
          python3 release-tools/scripts/release_siblings.py --root ALICE-LOL --resolve > siblings.txt
          cat siblings.txt
          n=0
          while read -r dir _package _version tag; do
            git -c advice.detachedHead=false clone -q --depth 1 --branch "$tag" "https://github.com/ext-sakamoro/$dir.git" "$dir"
            n=$((n + 1))
          done < siblings.txt
          if [ "$n" -eq 0 ]; then
            echo "error: no sibling was checked out" >&2
            exit 1
          fi

      # the checked-out siblings must be the versions the lock was resolved against
      - name: Lock matches the siblings
        working-directory: ALICE-LOL
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: cargo publish --dry-run
        working-directory: ALICE-LOL/${{ needs.detect-crate.outputs.crate }}
        run: cargo publish --dry-run

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-crate, dry-run-publish]
    # a release is made only for the commit the tag already names: a dispatch with `ref`
    # tries a commit before its tag exists and must not make a tag or a release
    if: github.event_name != 'workflow_dispatch' || (inputs.release && inputs.ref == '')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true

      - name: The tag exists and is the checked-out commit
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch -q origin "refs/tags/$TAG:refs/tags/$TAG"
          tagged=$(git rev-parse "refs/tags/$TAG^{commit}")
          head=$(git rev-parse HEAD)
          echo "tag $TAG -> $tagged, checked out $head"
          if [ "$tagged" != "$head" ]; then
            echo "error: the tag $TAG names $tagged, not the checked-out commit $head" >&2
            exit 1
          fi

      - name: Extract CHANGELOG excerpt
        id: changelog
        shell: bash
        run: |
          VERSION="${{ needs.detect-crate.outputs.version }}"
          CRATE="${{ needs.detect-crate.outputs.crate }}"
          # Prefer per-crate CHANGELOG.md if it exists; fall back to workspace root.
          if [[ -f "$CRATE/CHANGELOG.md" ]]; then
            FILE="$CRATE/CHANGELOG.md"
          else
            FILE="CHANGELOG.md"
          fi
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (match($0, /\[[^]]+\]/)) {
                tag = substr($0, RSTART+1, RLENGTH-2)
                if (tag == ver) { in_section=1; print; next }
                if (in_section) { exit }
              }
            }
            # the link definitions at the end of the file are not part of the notes of a version
            in_section && !/^\[[^]]+\]: / { print }
          ' "$FILE" > release_notes.md || true
          if [[ ! -s release_notes.md ]]; then
            echo "See CHANGELOG.md for details." > release_notes.md
          fi
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ needs.detect-crate.outputs.crate }} ${{ needs.detect-crate.outputs.version }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          draft: false
          prerelease: false
