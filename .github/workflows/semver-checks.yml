name: Semver checks

# The public API of alice-lol may change only as far as the version in alice-lol/Cargo.toml
# allows, measured from the latest alice-lol release on crates.io (scripts/semver_gate.py):
# cargo-semver-checks runs once per consumer feature set (.github/semver-gate.toml), and the
# job fails when a change needs a larger step than the two versions make, when the tool did
# not run or names another step, or when a run compared 0 checks. A major step (0.x: a minor
# bump) is not compared. Cargo.toml keeps the released version until the next release is cut,
# and an equal version is checked as the smallest next release (`equal-version`).
#
# alice-lol-macro is not checked: it is a proc-macro crate, and cargo-semver-checks reads
# the rustdoc of library targets only ("no crates with library targets selected"). The
# macros it exports reach users through alice-lol's re-exports, which the alice-lol run sees
#
# The workspace path-depends on the sibling repositories, so they are checked out beside it
# as in ci.yml; alice-lol's API includes items it re-exports from alice-sdf
#
# Not on every push: only on a change to the files in .github/paths/semver-checks.txt, and
# weekly (a release on crates.io, or a change in a sibling, can move the result without a
# commit here).
#
# scripts/preflight.sh (full run) runs the same command.

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/semver-checks.txt)
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - 'alice-lol/src/**'
      - 'alice-lol/Cargo.toml'
      - 'alice-lol-macro/src/**'
      - 'alice-lol-macro/Cargo.toml'
      - 'alice-lol-layout/src/**'
      - 'alice-lol-layout/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/semver_gate.py'
      - 'scripts/test_semver_gate.py'
      - 'scripts/release_baseline.py'
      - 'scripts/test_release_baseline.py'
      - '.github/semver-gate.toml'
      - 'scripts/changed_paths.py'
      - '.github/actions/alice-siblings/**'
      - '.github/alice-siblings'
      - '.github/workflows/semver-checks.yml'
      - '.github/paths/semver-checks.txt'
  schedule:
    # every Monday 11:00 UTC (two hours after security-audit.yml)
    - cron: '0 11 * * 1'
  workflow_dispatch:

# on main each commit has a group of its own and a run there is never
# cancelled; a newer run cancels an older one only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

# The token only reads the repository
permissions:
  contents: read

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/semver-checks.txt

  semver-checks:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-semver-checks (alice-lol, latest crates.io release, consumer feature sets)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ALICE-LOL
    steps:
      # the siblings the workspace path-depends on, the layout of ci.yml
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: ALICE-LOL
          persist-credentials: false
      - uses: ./ALICE-LOL/.github/actions/alice-siblings
        with:
          repo-dir: ALICE-LOL
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch, default toolchain stable)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ALICE-LOL

      # pinned: newer releases raise their own required rustc version, so the pin
      # moves together with rust-toolchain.toml
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-semver-checks@0.50.0

      # recorded tool outputs, and the real tool on two small crates (fails when the
      # tool is missing, so the recorded lines cannot drift from the tool unseen)
      - name: semver gate (tests)
        run: python3 scripts/test_semver_gate.py
      - name: release baseline (tests, the shared base of a crate under a publication freeze)
        run: python3 scripts/test_release_baseline.py

      # exit 1: a change the step does not allow, a run that compared nothing or named
      # another step; exit 2: crates.io or the configuration could not be read
      - name: semver gate (alice-lol, latest crates.io release, every consumer feature set)
        run: python3 scripts/semver_gate.py --manifest alice-lol/Cargo.toml --config .github/semver-gate.toml --target-dir target/semver

  # one result for the workflow: run=true needs every job above to succeed, run=false
  # needs them skipped (a skipped, cancelled or failed job after run=true is red)
  gate:
    name: Gate
    if: always()
    needs: [changes, semver-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
