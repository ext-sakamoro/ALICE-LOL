name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: default features only (backward compat + baseline).
          - os: macos-latest
            features: ""
            label: ""
          # Ubuntu: exercise the llm-bridge feature so B-6 + all future
          # bridge changes are gated by CI. This also pulls in ALICE-LLM
          # via the optional path dep (sibling checkout below).
          - os: ubuntu-latest
            features: "--features llm-bridge"
            label: " llm-bridge"
          # Ubuntu: exercise all 3 shader backends (glsl / wgsl / hlsl) so
          # tests/backend_parity.rs (Milestone A.4) is actually run in CI.
          # cfg-gated on all 3 features, otherwise the module is empty.
          - os: ubuntu-latest
            features: "--features glsl,wgsl,hlsl"
            label: " backend-parity"
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM

      # alice-lol-robot (default features) の mandatory path dep
      # (kinematics feature 経由の 8-byte packet bridge)
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Kinematics
          path: ALICE-Kinematics

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      - name: Create SDF dependency stubs
        run: |
          # alice-physics は crates.io 0.14.0-preview.5 publish 済 (alice-lol の
          # `version = "0.14.0-preview.4"` constraint を満たすため stub 側 version を追従)
          # 他 4 stub は現状の 0.1.0 継続 (alice-sdf 側 bridge feature 削除で dead)
          for crate_info in \
            "ALICE-Physics:alice-physics:0.14.0-preview.5" \
            "ALICE-Codec:alice-codec:0.1.0" \
            "ALICE-Streaming-Protocol:libasp:0.1.0" \
            "ALICE-Cache:alice-cache:0.1.0" \
            "ALICE-Foundry:alice-foundry:0.1.0"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            ver=$(echo "$crate_info" | cut -d: -f3)
            mkdir -p "$dir/src"
            cat > "$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "$ver"
          edition = "2021"
          [lib]
          path = "src/lib.rs"
          [features]
          default = []
          std = []
          lol = []
          TOML
            echo "" > "$dir/src/lib.rs"
          done

      - name: Build
        working-directory: ALICE-LOL
        run: cargo build ${{ matrix.features }}

      - name: Test
        working-directory: ALICE-LOL
        run: cargo test ${{ matrix.features }}

      # Phase X.8 B-8: catch example bit-rot. `required-features` on
      # llm-bridge-only examples auto-skips them on the macos default
      # matrix, so a single line covers both configurations.
      - name: Build examples
        working-directory: ALICE-LOL
        run: cargo build --examples ${{ matrix.features }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM

      # alice-lol-robot (default features) の mandatory path dep
      # (kinematics feature 経由の 8-byte packet bridge)
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Kinematics
          path: ALICE-Kinematics

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      - name: Create SDF dependency stubs
        run: |
          # alice-physics は crates.io 0.14.0-preview.5 publish 済 (alice-lol の
          # `version = "0.14.0-preview.4"` constraint を満たすため stub 側 version を追従)
          # 他 4 stub は現状の 0.1.0 継続 (alice-sdf 側 bridge feature 削除で dead)
          for crate_info in \
            "ALICE-Physics:alice-physics:0.14.0-preview.5" \
            "ALICE-Codec:alice-codec:0.1.0" \
            "ALICE-Streaming-Protocol:libasp:0.1.0" \
            "ALICE-Cache:alice-cache:0.1.0" \
            "ALICE-Foundry:alice-foundry:0.1.0"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            ver=$(echo "$crate_info" | cut -d: -f3)
            mkdir -p "$dir/src"
            cat > "$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "$ver"
          edition = "2021"
          [lib]
          path = "src/lib.rs"
          [features]
          default = []
          std = []
          lol = []
          TOML
            echo "" > "$dir/src/lib.rs"
          done

      - name: Clippy
        working-directory: ALICE-LOL
        run: cargo clippy --features llm-bridge -- -W clippy::pedantic -W clippy::nursery

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM

      # alice-lol-robot (default features) の mandatory path dep
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Kinematics
          path: ALICE-Kinematics

      - name: Create SDF dependency stubs
        run: |
          # alice-physics stub は crates.io 0.14.0-preview.5 に追従 (alice-lol 制約)
          for crate_info in "ALICE-Physics:alice-physics:0.14.0-preview.5" "ALICE-Codec:alice-codec:0.1.0" "ALICE-Streaming-Protocol:libasp:0.1.0" "ALICE-Cache:alice-cache:0.1.0" "ALICE-Foundry:alice-foundry:0.1.0"; do
            dir=$(echo "$crate_info" | cut -d: -f1); pkg=$(echo "$crate_info" | cut -d: -f2); ver=$(echo "$crate_info" | cut -d: -f3)
            mkdir -p "$dir/src"
            printf '[package]\nname = "%s"\nversion = "%s"\nedition = "2021"\n[lib]\npath = "src/lib.rs"\n[features]\ndefault = []\nstd = []\nlol = []\n' "$pkg" "$ver" > "$dir/Cargo.toml"
            echo "" > "$dir/src/lib.rs"
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: ALICE-LOL
        run: cargo fmt -- --check

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
