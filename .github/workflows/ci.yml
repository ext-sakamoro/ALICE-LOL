name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: default features only (backward compat + baseline).
          - os: macos-latest
            features: ""
            label: ""
          # Ubuntu: exercise the llm-bridge feature so B-6 + all future
          # bridge changes are gated by CI. This also pulls in ALICE-LLM
          # via the optional path dep (sibling checkout below).
          - os: ubuntu-latest
            features: "--features llm-bridge"
            label: " llm-bridge"
    steps:
      - uses: actions/checkout@v4
        with:
          path: ALICE-LOL

      - uses: actions/checkout@v4
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      - uses: actions/checkout@v4
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      - name: Create SDF dependency stubs
        run: |
          for crate_info in \
            "ALICE-Physics:alice-physics" \
            "ALICE-Codec:alice-codec" \
            "ALICE-Streaming-Protocol:libasp" \
            "ALICE-Cache:alice-cache"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            mkdir -p "$dir/src"
            cat > "$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "0.1.0"
          edition = "2021"
          [lib]
          path = "src/lib.rs"
          [features]
          default = []
          std = []
          TOML
            echo "" > "$dir/src/lib.rs"
          done

      - name: Build
        working-directory: ALICE-LOL
        run: cargo build ${{ matrix.features }}

      - name: Test
        working-directory: ALICE-LOL
        run: cargo test ${{ matrix.features }}

      # Phase X.8 B-8: catch example bit-rot. `required-features` on
      # llm-bridge-only examples auto-skips them on the macos default
      # matrix, so a single line covers both configurations.
      - name: Build examples
        working-directory: ALICE-LOL
        run: cargo build --examples ${{ matrix.features }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ALICE-LOL

      - uses: actions/checkout@v4
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      - uses: actions/checkout@v4
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      - name: Create SDF dependency stubs
        run: |
          for crate_info in \
            "ALICE-Physics:alice-physics" \
            "ALICE-Codec:alice-codec" \
            "ALICE-Streaming-Protocol:libasp" \
            "ALICE-Cache:alice-cache"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            mkdir -p "$dir/src"
            cat > "$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "0.1.0"
          edition = "2021"
          [lib]
          path = "src/lib.rs"
          [features]
          default = []
          std = []
          TOML
            echo "" > "$dir/src/lib.rs"
          done

      - name: Clippy
        working-directory: ALICE-LOL
        run: cargo clippy --features llm-bridge -- -W clippy::pedantic -W clippy::nursery

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ALICE-LOL

      - uses: actions/checkout@v4
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      - uses: actions/checkout@v4
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM

      - name: Create SDF dependency stubs
        run: |
          for crate_info in "ALICE-Physics:alice-physics" "ALICE-Codec:alice-codec" "ALICE-Streaming-Protocol:libasp" "ALICE-Cache:alice-cache"; do
            dir=$(echo "$crate_info" | cut -d: -f1); pkg=$(echo "$crate_info" | cut -d: -f2)
            mkdir -p "$dir/src"
            printf '[package]\nname = "%s"\nversion = "0.1.0"\nedition = "2021"\n[lib]\npath = "src/lib.rs"\n[features]\ndefault = []\nstd = []\n' "$pkg" > "$dir/Cargo.toml"
            echo "" > "$dir/src/lib.rs"
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: ALICE-LOL
        run: cargo fmt -- --check

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
