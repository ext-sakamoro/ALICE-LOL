name: CI

on:
  push:
    # ci/**: 取り込み前の branch の CI を main と同じ job で走らせる
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

# a newer push to the same branch cancels the older run (a superseded run only holds a
# runner); on main each commit has a group of its own, so no main commit loses its run
# (a group keeps one pending run and cancels an older pending one, whatever
# cancel-in-progress says)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # job 全体の上限 (後片付けの step を含む) 直近 15 回の success は最長 16 分、
    # cache が無い時の build の余裕を見て約 3 倍 後片付けの step で止まった run は
    # これが無いと 6 時間 runner を占有する
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: default features only (backward compat + baseline).
          - os: macos-latest
            features: ""
            label: ""
          # Ubuntu: exercise the llm-bridge feature so B-6 + all future
          # bridge changes are gated by CI. This also pulls in ALICE-LLM
          # via the optional path dep (sibling checkout below).
          - os: ubuntu-latest
            features: "--features llm-bridge"
            label: " llm-bridge"
          # Ubuntu: exercise all 3 shader backends (glsl / wgsl / hlsl) so
          # tests/backend_parity.rs (Milestone A.4) is actually run in CI.
          # cfg-gated on all 3 features, otherwise the module is empty.
          - os: ubuntu-latest
            features: "--features glsl,wgsl,hlsl"
            label: " backend-parity"
          # Ubuntu: exercise the physics feature so tests/analytic_thermal.rs
          # (`#![cfg(feature = "physics")]`, 5 tests + the thermal analytic
          # oracle) is actually executed. clippy / msrv already pass
          # `--all-features`, but those only *compile* the test target — until
          # this entry existed the file ran 0 tests in CI. alice-physics is the
          # optional path dep resolved by the sibling checkout below.
          - os: ubuntu-latest
            features: "--features physics"
            label: " physics"
          # Ubuntu: exercise the roblox feature so tests/analytic_roblox_export.rs
          # (`required-features = ["roblox"]`) is actually executed. clippy / msrv
          # compile `--all-features` but never ran a test, so `roblox_export` had
          # no test at all and a non-watertight / over-limit mesh went unnoticed.
          - os: ubuntu-latest
            features: "--features roblox"
            label: " roblox"
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      # research_law が使う alice-zip (path dep `../../ALICE-Zip`)
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM

      # alice-lol-robot (default features) の mandatory path dep
      # (kinematics feature 経由の 8-byte packet bridge)
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Kinematics
          path: ALICE-Kinematics

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      # alice-lol `physics` feature の optional path dep (--all-features で実 compile)
      # 2026-09-17: manifest-only stub (空 lib) は --all-features で E0433 になるので
      # real sibling checkout に置換、Codec / Streaming / Cache / Foundry の stub は
      # どの Cargo.toml も参照していなかった (dead) ので撤去
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Physics
          path: ALICE-Physics

      - name: Build
        working-directory: ALICE-LOL
        run: cargo build ${{ matrix.features }}

      - name: Test
        working-directory: ALICE-LOL
        shell: bash
        run: cargo test ${{ matrix.features }} 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"

      # 上の Test の log から、法則の oracle が test target ごとに 1 件以上実行されたかを確かめる
      # (同じ target を走らせ直すと最も重い oracle を二度実行するので、log を読む)
      # どれか 1 つでも log に無い / 0 件実行なら fail
      # (feature で module が消える / target の登録が外れると `cargo test` は green のまま、
      # 複数 target の合計では 1 つの空振りが他の件数に隠れる) law::/research_law を使う
      # test file が scripts/law_tests.sh に無い場合も fail する
      - name: Law oracles (each target ran at least one test)
        if: matrix.label == ''
        working-directory: ALICE-LOL
        shell: bash
        run: |
          scripts/law_tests.sh list
          python3 scripts/law_tests_from_log.py default "$RUNNER_TEMP/cargo-test.log"

      - name: Law oracles (physics, each target ran at least one test)
        if: matrix.label == ' physics'
        working-directory: ALICE-LOL
        shell: bash
        run: python3 scripts/law_tests_from_log.py physics "$RUNNER_TEMP/cargo-test.log"

      # `required-features` 付きの test target は feature が無いと黙ってスキップされるので、
      # roblox の entry では名指しで走らせる (target が消える / 登録が外れるとここで fail する)
      - name: Test (roblox oracle, named)
        if: matrix.label == ' roblox'
        working-directory: ALICE-LOL
        run: cargo test ${{ matrix.features }} --test analytic_roblox_export

      # Phase X.8 B-8: catch example bit-rot. `required-features` on
      # llm-bridge-only examples auto-skips them on the macos default
      # matrix, so a single line covers both configurations.
      - name: Build examples
        working-directory: ALICE-LOL
        run: cargo build --examples ${{ matrix.features }}

      # 入力の読み方を LOL 自身 (law_input) で実装した監査の CLI を、Python の参照実装と
      # 同じ probe に通す (決めた答えとの違いが 1 件でも、比べた件数が 0 でも fail)
      - name: Probes (audit laws, implemented with law_input)
        if: matrix.label == ''
        working-directory: ALICE-LOL
        shell: bash
        run: python3 conformance/check_probes.py --kind reader --laws gate_compares_nonzero,identifier_feature_independent,no_such_law,decl_probe,floor_probe -- target/debug/examples/audit_conformance

      # 宣言の行を崩した law file (空白の種類と位置、unicode、大文字小文字、改行、NUL、長い行) を
      # Rust (law_input) と参照実装の両方に読ませ、受理・拒否と判定が一致することを確かめる
      # (違いが 1 件でも、比べた件数が 0 でも fail)
      - name: Law-file line fuzz (Rust vs reference)
        if: matrix.label == ''
        working-directory: ALICE-LOL
        shell: bash
        run: python3 conformance/law_line_fuzz.py --pairs 150 -- python3 conformance/ref_impl.py -- target/debug/examples/audit_conformance

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      # research_law が使う alice-zip (path dep `../../ALICE-Zip`)
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM

      # alice-lol-robot (default features) の mandatory path dep
      # (kinematics feature 経由の 8-byte packet bridge)
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Kinematics
          path: ALICE-Kinematics

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      # alice-lol `physics` feature の optional path dep (--all-features で実 compile)
      # 2026-09-17: manifest-only stub (空 lib) は --all-features で E0433 になるので
      # real sibling checkout に置換、Codec / Streaming / Cache / Foundry の stub は
      # どの Cargo.toml も参照していなかった (dead) ので撤去
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Physics
          path: ALICE-Physics

      - name: Clippy
        working-directory: ALICE-LOL
        # 2026-09-17: -W → -D、lib のみ → workspace 全 target 全 feature
        # (toolchain は rust-toolchain.toml pin)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic -D clippy::nursery

  # 他の job は sibling crate を path (各 repo の main) で引くので、公開した `alice-lol` が
  # crates.io から引く版では一度も build されない ここでは package した `alice-lol` だけに
  # 依存する crate を作り、macro の全 keyword をその crate から compile する
  # (0.2.0 の macro は alice-sdf 5.x の `Taper` と合わず、`::glam` を直接参照していた)
  registry-consumer:
    name: Registry consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL

      # cargo package が path dep の manifest を読むので sibling は要る (build には使わない)
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Kinematics
          path: ALICE-Kinematics

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Physics
          path: ALICE-Physics

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      - name: published-source oracle (検査器自身の試験)
        working-directory: ALICE-LOL
        run: python3 scripts/test_published_source_check.py

      # workspace 内の依存 (path + version) の版要求が解決する公開版と、手元の src が同じ
      - name: published source (workspace 内の依存が公開版と同じ src)
        working-directory: ALICE-LOL
        run: python3 scripts/published_source_check.py

      - name: license-check (package の一覧に LICENSE-APACHE / NOTICE / TRADEMARK_NOTICE)
        working-directory: ALICE-LOL
        run: python3 scripts/license_check.py --package

      - name: registry consumer (macro の全 keyword を crates.io の依存で compile)
        working-directory: ALICE-LOL
        run: scripts/registry_consumer.sh

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      # research_law が使う alice-zip (path dep `../../ALICE-Zip`)
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM

      # alice-lol-robot (default features) の mandatory path dep
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Kinematics
          path: ALICE-Kinematics

      # alice-lol `physics` feature の optional path dep (--all-features で実 compile)
      # 2026-09-17: manifest-only stub (空 lib) は --all-features で E0433 になるので
      # real sibling checkout に置換、Codec / Streaming / Cache / Foundry の stub は
      # どの Cargo.toml も参照していなかった (dead) ので撤去
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Physics
          path: ALICE-Physics

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: ALICE-LOL
        run: cargo fmt -- --check

  # LOL grammar corpus 全構文 + 深い合成 fixture を GPU で実行して CPU eval と
  # 突合する (tests/gpu_parity.rs、Milestone A.4.1) GitHub runner に GPU は
  # 無いので Mesa の software Vulkan (lavapipe) を入れ、ALICE_SDF_REQUIRE_GPU=1
  # で「adapter なし → skip」を fail にする (alice-sdf ci.yml gpu-parity と同型)
  gpu-parity:
    name: GPU parity (lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALICE_SDF_REQUIRE_GPU: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      # research_law が使う alice-zip (path dep `../../ALICE-Zip`)
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Physics
          path: ALICE-Physics
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Kinematics
          path: ALICE-Kinematics
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      # The lavapipe ICD file name depends on the Mesa build
      # (`lvp_icd.x86_64.json` up to 24.x, `lvp_icd.json` from 25.x on
      # noble-updates): locate it instead of hard-coding, and prove the loader
      # sees llvmpipe before spending a build on the tests.
      - name: Install Mesa software Vulkan (lavapipe)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          icd=$(find /usr/share/vulkan/icd.d -name "lvp_icd*.json" | head -1)
          echo "lavapipe ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary | tee /tmp/vulkaninfo.txt | head -60
          grep -qi llvmpipe /tmp/vulkaninfo.txt

      - name: GPU ↔ CPU parity (grammar corpus + fixtures)
        working-directory: ALICE-LOL
        run: cargo test -p alice-lol --features wgsl --test gpu_parity -- --nocapture

  msrv:
    name: MSRV (rust-version = 1.90)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      # research_law が使う alice-zip (path dep `../../ALICE-Zip`)
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Physics
          path: ALICE-Physics
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Kinematics
          path: ALICE-Kinematics
      # Cargo.toml `rust-version` を実証する (宣言だけの MSRV は
      # clippy の incompatible_msrv を黙らせる)
      # 宣言値と同じ toolchain を pin し、全 feature で check が通ることを確認
      # 宣言を上げる時はここも上げる (alice-sdf 3.0.0 は 1.85、本 crate は const fn の f32::round が 1.90 を要求)
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      - name: Check (workspace, all features)
        working-directory: ALICE-LOL
        # rust-toolchain.toml の 1.98.1 pin を `+1.90` で明示的に上書き (Physics ci.yml と同型)
        run: cargo +1.90 check --workspace --all-targets --all-features

  # 配線ガード: 実装したが production から呼ばれていない pub item と、理由の無い
  # allow(dead_code) の新規追加を止める (既存分は scripts/wiring-baseline.txt)
  # 併せて版ガード: 同じ alice-* crate が 2 版以上 lock に入っている (= 同じ法則が
  # degenerate-parameter grid: every SDF keyword's `.lol` text, with one or
  # two numeric literals at a time pushed to a value hostile to a
  # cast/limit/division, must never hang, crash, or allocate unboundedly (see
  # tests/degenerate_grid.rs's module doc) ubuntu only: killing a subprocess
  # cleanly on a 2s timeout has different semantics on macOS/Windows, and
  # the existing Test matrix already runs the full suite (this file
  # included, but `#[ignore]`d there) on every OS -- this job's value is the
  # breadth of the sweep (~35,000 cases, ~90s), not its OS coverage
  degenerate-grid:
    name: Degenerate-parameter grid (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Kinematics
          path: ALICE-Kinematics
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Physics
          path: ALICE-Physics

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      - name: Degenerate-parameter grid (one-at-a-time / all-same / pairwise, ~35,000 cases)
        working-directory: ALICE-LOL
        run: cargo test --test degenerate_grid -- --ignored --nocapture

  # 2 通りに評価されうる) 状態を止める (既存分は scripts/lock-duplicates-baseline.txt)
  # 併せて算術ガード: 判定を出す file で platform の libm (値が IEEE 754 で規定されて
  # いない超越関数) を直呼びしている状態を止める (= 同じ実測で判定が機械ごとに割れる)
  # 既存分は scripts/det-math-baseline.txt に理由付きで置く
  # 検査器自身が OS 依存で空振り / 異常終了しないよう、test matrix と同じ 3 OS で動かす
  # (検査対象 0 件は empty_scan / nothing compared で fail する)
  wiring-guard:
    name: Wiring guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: wiring-guard oracle (検査器自身の試験)
        run: python scripts/test_wiring_guard.py
      - name: wiring-guard (新規の未配線 / 理由の無い dead_code が無い)
        run: python scripts/wiring_guard.py
      - name: parser-no-direct-validating-builders oracle (検査器自身の試験)
        run: python scripts/test_parser_no_direct_validating_builders.py
      - name: parser-no-direct-validating-builders (parser は validate() 付き infallible builder を直接呼ばない)
        run: python scripts/parser_no_direct_validating_builders.py
      - name: runtime-keywords oracle (検査器自身の試験)
        run: python scripts/test_runtime_keywords.py
      - name: runtime-keywords (parser の keyword dispatch と syntax_table.rs の SDF_SYNTAX が一致)
        run: python scripts/runtime_keywords.py
      - name: lock-single-version oracle (検査器自身の試験)
        run: python scripts/test_lock_single_version.py
      - name: lock-single-version (alice-* が 2 版以上 lock に入っていない)
        run: python scripts/lock_single_version.py
      - name: det-math-guard oracle (検査器自身の試験)
        run: python scripts/test_det_math_guard.py
      - name: det-math-guard (判定経路に platform 依存の超越関数が無い)
        run: python scripts/det_math_guard.py
      - name: macro kinds (macro の全 keyword を試験 file が持つ)
        run: python scripts/macro_kinds.py --check
      - name: fuzz-runs oracle (fuzz の log の検査器自身の試験)
        run: python scripts/test_fuzz_runs.py
      - name: release-roster oracle (検査器自身の試験)
        run: python scripts/test_release_roster.py
      - name: release-roster (公開できる crate は alice-lol-macro と alice-lol だけ)
        run: python scripts/release_roster.py
      - name: license-check oracle (検査器自身の試験)
        run: python scripts/test_license_check.py
      - name: license-check (各 crate の license と、公開する crate が持つ LICENSE-APACHE / NOTICE / TRADEMARK_NOTICE)
        run: python scripts/license_check.py

  # README / README_JP の構文表・法則表・feature 表・MSRV・使用例・リンクがコードと一致すること
  # (scripts/readme_sync.py) と、公開文書と全 tracked file の語彙 (scripts/docs_lint.py)
  # 検査器自身が OS 依存で空振り / 異常終了しないよう 3 OS で動かす (比較 0 件は fail)
  docs:
    name: Docs gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # the reference implementation evaluates elementary functions correctly rounded (mpmath)
      - name: conformance requirements (mpmath)
        run: python -m pip install -r conformance/requirements.txt
      - name: readme_sync oracle (検査器自身の試験)
        run: python scripts/test_readme_sync.py
      - name: readme_sync (README とコードの一致)
        run: python scripts/readme_sync.py --check
      - name: docs_lint oracle (検査器自身の試験)
        run: python scripts/test_docs_lint.py
      - name: docs_lint (公開文書と tracked file の語彙、CHANGELOG の構造)
        run: python scripts/docs_lint.py --check
      - name: law_corners oracle (corner 生成器と corpus 被覆検査器の試験)
        run: python scripts/test_law_corners.py
      - name: law_corners (laws/spike の全 law file から corner を列挙、0 件は fail)
        run: python scripts/law_corners.py laws/spike
      - name: line_split_guard oracle (検査器自身の試験)
        run: python scripts/test_line_split_guard.py
      - name: line_split_guard (law file の読み手は LF だけで行を分ける)
        run: python scripts/line_split_guard.py
      - name: workflow_concurrency oracle (検査器自身の試験)
        run: python scripts/test_workflow_concurrency.py
      - name: workflow_concurrency (branch の push で走る workflow に concurrency、0 件は fail)
        run: python scripts/workflow_concurrency.py
      - name: changed_paths oracle (path filter の判定器と trigger lint の試験)
        run: python scripts/test_changed_paths.py
      - name: changed_paths sync (on.push に paths が無い、pull_request の paths と pattern file が一致、0 件は fail)
        run: python scripts/changed_paths.py sync
      - name: workflow_timeouts oracle (検査器自身の試験)
        run: python scripts/test_workflow_timeouts.py
      - name: workflow_timeouts (全 workflow の全 job に timeout-minutes、0 件は fail)
        run: python scripts/workflow_timeouts.py
      - name: history_free_tests oracle (検査器自身の試験)
        run: python scripts/test_history_free_tests.py
      - name: history_free_tests (試験が repo の履歴を読まない、走査 0 件は fail)
        run: python scripts/history_free_tests.py
      - name: law_ambiguity_lint oracle (検査器自身の試験)
        run: python scripts/test_law_ambiguity_lint.py
      - name: law_ambiguity_lint (method scope / range provenance / 言語中立性、0 件は fail)
        run: python scripts/law_ambiguity_lint.py laws/spike
      - name: law_schema oracle (x-input の型の構文と照合の試験)
        run: python scripts/test_law_schema.py
      - name: law_schema (laws/spike の全 x-input の型を読む、0 件は fail)
        run: python scripts/law_schema.py laws/spike
      - name: probe checker (the kind of an implementation decides which probes count)
        run: python conformance/test_check_probes.py
      - name: conformance runner (every spawned request receives the law directory)
        run: python conformance/test_run_conformance.py
      - name: reference implementation (a non-finite value of a quantitative law is a rejection)
        run: python conformance/test_ref_finite.py
      - name: probes (決めた読み方を参照実装で確かめる、比較 0 件は fail)
        run: python conformance/check_probes.py --kind reader -- python conformance/ref_impl.py

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
