name: Fuzz

# ALICE-* 共通の CI 構成
# ALICE-SDF v1.7.7 base、ALICE-LOL 4 target: parse / to_wgsl / eval / emit_parity

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/fuzz.txt)
    # ci/** too, so that a branch runs the fuzz gate before it lands (the same paths filter)
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - '**/src/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/**'
      - '.github/paths/fuzz.txt'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Per-target fuzz duration (seconds)'
        required: false
        default: '60'
        type: string

# a superseded run on a branch is cancelled; on main each commit has a group of its own
# and is never cancelled (a cancelled main commit is unverified)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/fuzz.txt

  fuzz:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Fuzz — ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # the runners are shared: a ci/** branch takes two at a time, main four
      max-parallel: ${{ github.ref == 'refs/heads/main' && 4 || 2 }}
      matrix:
        target:
          - fuzz_lol_parse
          - fuzz_lol_to_wgsl
          - fuzz_lol_eval
          - fuzz_lol_emit_parity
    steps:
      # ci.yml と同じ checkout 構成: alice-lol lib は実 alice-sdf が必須
      # (2026-09-16 に security-audit.yml も real checkout に統一、stub action 廃止)
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      # research_law が使う alice-zip (path dep `../../ALICE-Zip`)
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM

      # alice-lol-robot (default features) の mandatory path dep
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Kinematics
          path: ALICE-Kinematics

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL/fuzz

      # optional path dep (alice-physics) の manifest は要らない: fuzz の lock は physics を含まず、
      # sibling が無くても `cargo check --locked` が通る (以前の stub 作成 step は撤去)
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # build は blocking: compile error を continue-on-error で隠さない
      # (job-level continue-on-error だと fuzz target の
      #  compile error が green 表示で silent になる)
      - name: Build fuzz target
        run: |
          cd ALICE-LOL/fuzz
          cargo +nightly fuzz build "${{ matrix.target }}"

      - name: Set fuzz duration
        id: dur
        run: |
          DURATION="${{ github.event.inputs.duration_seconds }}"
          if [ -z "$DURATION" ]; then
            DURATION=60
          fi
          echo "seconds=$DURATION" >> "$GITHUB_OUTPUT"

      # crash は red: 以前は continue-on-error で crash が warning だけになり run は success だった
      # (main の直近 4 run で 4 target 中 2〜4 target が crash していた)
      - name: Run fuzz target (time-boxed)
        id: run
        shell: bash
        run: |
          set -o pipefail
          cd ALICE-LOL/fuzz
          # seeds/<target> holds the inputs of earlier crashes (read only); corpus/<target> is
          # where libFuzzer writes what it finds
          mkdir -p "corpus/${{ matrix.target }}"
          cargo +nightly fuzz run "${{ matrix.target }}" \
            "corpus/${{ matrix.target }}" "seeds/${{ matrix.target }}" -- \
            -max_total_time=${{ steps.dur.outputs.seconds }} 2>&1 | tee "$RUNNER_TEMP/fuzz.log"

      # 実行回数を log から読む: crash も、1 回も走らなかった run も red
      # (target ごとの runs / 秒 / 結果を job summary に出す)
      - name: Check the runs (crash or 0 runs = fail)
        if: always() && steps.run.outcome != 'skipped'
        shell: bash
        run: |
          {
            echo "| target | runs | seconds | result |"
            echo "|---|---|---|---|"
            python3 ALICE-LOL/scripts/fuzz_runs.py "${{ matrix.target }}" "$RUNNER_TEMP/fuzz.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload crash artifacts
        if: failure() && steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: ALICE-LOL/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Report crash
        if: failure() && steps.run.outcome == 'failure'
        run: echo "::error::fuzz target ${{ matrix.target }} found a crash — see fuzz-crash-${{ matrix.target }} artifact"

  # one result for the workflow: run=true needs every job above to succeed, run=false needs
  # them skipped (a skipped, cancelled or failed job after run=true is red)
  gate:
    name: Gate
    if: always()
    needs: [changes, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
