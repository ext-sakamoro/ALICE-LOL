name: Fuzz

# canonical CI template: [[reference_alice_ci_canonical_template]]
# ALICE-SDF v1.7.7 base、ALICE-LOL 3 target: parse / to_wgsl / eval

on:
  push:
    branches: [main]
    paths:
      - '**/src/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - '**/src/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Per-target fuzz duration (seconds)'
        required: false
        default: '60'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz — ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_lol_parse
          - fuzz_lol_to_wgsl
          - fuzz_lol_eval
    steps:
      # ci.yml と同じ checkout 構成: alice-lol lib は実 alice-sdf が必須
      # (2026-09-16 に security-audit.yml も real checkout に統一、stub action 廃止)
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM

      # alice-lol-robot (default features) の mandatory path dep
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Kinematics
          path: ALICE-Kinematics

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL/fuzz

      # optional path dep の stub (ci.yml と同一、alice-sdf 側 bridge 含む)
      - name: Create SDF dependency stubs
        run: |
          for crate_info in \
            "ALICE-Physics:alice-physics:1.0.0" \
            "ALICE-Codec:alice-codec:0.1.0" \
            "ALICE-Streaming-Protocol:libasp:0.1.0" \
            "ALICE-Cache:alice-cache:0.1.0" \
            "ALICE-Foundry:alice-foundry:0.1.0"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            ver=$(echo "$crate_info" | cut -d: -f3)
            mkdir -p "$dir/src"
            cat > "$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "$ver"
          edition = "2021"
          [lib]
          path = "src/lib.rs"
          [features]
          default = []
          std = []
          lol = []
          TOML
            echo "" > "$dir/src/lib.rs"
          done

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # build は blocking: compile error を continue-on-error で隠さない
      # (canonical 罠 #22: job-level continue-on-error だと fuzz target の
      #  compile error が green 表示で silent になる)
      - name: Build fuzz target
        run: |
          cd ALICE-LOL/fuzz
          cargo +nightly fuzz build "${{ matrix.target }}"

      - name: Set fuzz duration
        id: dur
        run: |
          DURATION="${{ github.event.inputs.duration_seconds }}"
          if [ -z "$DURATION" ]; then
            DURATION=60
          fi
          echo "seconds=$DURATION" >> "$GITHUB_OUTPUT"

      # run は informational: crash 発見は block せず artifact で triage
      - name: Run fuzz target (time-boxed)
        id: run
        continue-on-error: true
        run: |
          cd ALICE-LOL/fuzz
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            -max_total_time=${{ steps.dur.outputs.seconds }}

      - name: Upload crash artifacts (if any)
        if: steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: ALICE-LOL/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Report crash (informational)
        if: steps.run.outcome == 'failure'
        run: echo "::warning::fuzz target ${{ matrix.target }} found a crash — see fuzz-crash-${{ matrix.target }} artifact"
