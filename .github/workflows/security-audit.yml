name: Security & Hygiene

# ALICE-* 共通の CI 構成
# ALICE-SDF v1.7.7 (commit 5a6056a) を base に ALICE-LOL 用に調整
# ALICE-LOL は workspace (alice-lol / alice-lol-macro / alice-lol-humanoid)
# 公開 API の crates.io 最新版に対する検査は semver-checks.yml (失敗させる)

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/security-audit.txt)
    # ci/** too, so that a dependency or deny.toml change is checked before it lands
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/src/**'
      - 'deny.toml'
      - '.github/alice-siblings'
      - '.github/workflows/security-audit.yml'
      - '.github/paths/security-audit.txt'
  schedule:
    # 毎週月曜 09:00 UTC = 18:00 JST
    - cron: '0 9 * * 1'
  workflow_dispatch:

# a superseded run on a branch is cancelled; on main each commit has a group of its own
# and is never cancelled (a cancelled main commit is unverified)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/security-audit.txt

  audit:
    name: cargo audit (RustSec CVE scan)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ALICE-LOL
    steps:
      # Real siblings, same layout as ci.yml / fuzz.yml (the manifest-only stubs
      # that used to stand in here hid alice-sdf's whole dependency tree from
      # audit / deny and their version had to be bumped by hand — 2026-09-16,
      # alice-sdf 2.0.0). Everything the workspace path-depends on is checked
      # out for real; unpublished siblings would need a stub again.
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL
      - uses: ./ALICE-LOL/.github/actions/alice-siblings
        with:
          repo-dir: ALICE-LOL

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # unmaintained ignores mirror deny.toml (bincode / paste via alice-sdf)
      - name: Run cargo audit
        run: cargo audit --deny yanked --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2024-0436

  deny:
    name: cargo-deny (license + advisories + bans + sources)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ALICE-LOL
    steps:
      # Real siblings, same layout as ci.yml / fuzz.yml (the manifest-only stubs
      # that used to stand in here hid alice-sdf's whole dependency tree from
      # audit / deny and their version had to be bumped by hand — 2026-09-16,
      # alice-sdf 2.0.0). Everything the workspace path-depends on is checked
      # out for real; unpublished siblings would need a stub again.
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL
      - uses: ./ALICE-LOL/.github/actions/alice-siblings
        with:
          repo-dir: ALICE-LOL

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny check all
        run: cargo deny --all-features check all

  unused-deps:
    name: cargo-machete (unused dependencies)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ALICE-LOL
    steps:
      # Real siblings, same layout as ci.yml / fuzz.yml (the manifest-only stubs
      # that used to stand in here hid alice-sdf's whole dependency tree from
      # audit / deny and their version had to be bumped by hand — 2026-09-16,
      # alice-sdf 2.0.0). Everything the workspace path-depends on is checked
      # out for real; unpublished siblings would need a stub again.
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL
      - uses: ./ALICE-LOL/.github/actions/alice-siblings
        with:
          repo-dir: ALICE-LOL

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Run cargo machete
        run: cargo machete

  stub-guard:
    name: Stub / mock / dbg guard (grep)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # todo!() / unimplemented!() は未実装を実行時に止める正当な
      # fail-fast の書き方なので informational のみ (ALICE-LOL
      # は旧 (block する) 版から drift していた、2026-10-02
      # alice-world-auditor scaffold の todo!() stub landing で発覚して修正)
      # block するのは明示的な STUB marker と dbg!() 残留のみ
      - name: Detect panic!(STUB) in src/** (blocking)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'panic!\([^)]*STUB' \
            . --include="*.rs" \
            --exclude-dir=bin \
            --exclude-dir=target \
            --exclude-dir=fuzz \
            || true)
          if [ -n "$hits" ]; then
            echo "❌ STUB panic detected in production path:"
            echo "$hits"
            exit 1
          fi
          echo "✓ No panic!(STUB) in workspace src/"

      - name: Detect todo! / unimplemented! (informational)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'todo!\(|unimplemented!\(' \
            . --include="*.rs" \
            --exclude-dir=bin \
            --exclude-dir=target \
            --exclude-dir=fuzz \
            || true)
          if [ -n "$hits" ]; then
            echo "::warning::todo!() / unimplemented!() found (legitimate fail-fast stub, informational, not blocking):"
            head -n 50 <<< "$hits"
          else
            echo "✓ No todo! / unimplemented! in workspace src/"
          fi

      - name: Detect dbg!() residual in src/**
        run: |
          set -eo pipefail
          hits=$(grep -rn 'dbg!(' . --include="*.rs" \
            --exclude-dir=target --exclude-dir=fuzz || true)
          if [ -n "$hits" ]; then
            echo "❌ dbg!() macro left in src/:"
            echo "$hits"
            exit 1
          fi
          echo "✓ No dbg!() in workspace"

      - name: Detect TODO / FIXME / XXX / HACK (informational)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'TODO|FIXME|XXX|HACK' . --include="*.rs" \
            --exclude-dir=target --exclude-dir=fuzz || true)
          if [ -n "$hits" ]; then
            echo "::warning::TODO/FIXME/XXX/HACK found (informational, not blocking):"
            head -n 50 <<< "$hits"
          else
            echo "✓ No TODO/FIXME/XXX/HACK in workspace"
          fi

  coverage:
    name: Coverage (cargo-llvm-cov、informational)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        working-directory: ALICE-LOL
    steps:
      # Real siblings, same layout as ci.yml / fuzz.yml (the manifest-only stubs
      # that used to stand in here hid alice-sdf's whole dependency tree from
      # audit / deny and their version had to be bumped by hand — 2026-09-16,
      # alice-sdf 2.0.0). Everything the workspace path-depends on is checked
      # out for real; unpublished siblings would need a stub again.
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL
      - uses: ./ALICE-LOL/.github/actions/alice-siblings
        with:
          repo-dir: ALICE-LOL

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # workspace 全体 (--workspace) を対象
      - name: Run coverage
        run: |
          cargo llvm-cov --workspace --lib --summary-only 2>&1 | tee coverage-summary.txt

      - name: Upload coverage summary as artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary
          path: ALICE-LOL/coverage-summary.txt
          retention-days: 30

  # red when the changes job said run and a job was skipped, cancelled or failed
  gate:
    name: Gate
    if: always()
    needs: [changes, audit, deny, unused-deps, stub-guard, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
