# 深層品質 job (canonical: ALICE-Physics `.github/workflows/quality-deep.yml`)
#
# - mutants : cargo-mutants で **sound 化した判定器の核の検出力**を測る
#             test が green でも、比較演算子を 1 つ書き換えて誰も落ちないなら
#             その分岐は検査されていない 生存変異 0 が gate (等価変異の除外は
#             `.cargo/mutants.toml` に理由付きで書く)
#
# 対象は `--re` で **核の関数に限定** する 2 つの理由 (2026-09-27 実測、初回
# run 36320622842 の失敗から):
#
#   1. `--file alice-lol/src/law.rs` は 433 mutant を選ぶが、その 61 件は
#      sound 化の**対象外**と既知の 3 proxy law (`check_continuity` /
#      `check_thermal` / `check_volume_conservation`、格子解像度依存) にある
#      → 「生存 0」を file 全体に課すと原理的に達成できない gate になる
#   2. 433 mutant × 175 s ≈ 21 時間で runner が落ちた test 集合に
#      `--test law_corpus_oracle` (debug 106 s) を入れていたのが主因なので、
#      測定の test 集合は `--lib` + 解析解 oracle + law_tests に絞る
#      (corpus oracle は ci.yml の test job 側で毎 push 回っている)
#
# **sound 化した law を足したら `--re` にその関数名を足すこと** — 足さないと
# 新しい判定経路は測定対象外のまま green に見える
#
# 2026-10-09: 監査の判定器 (`audit_law.rs` / `audit_law_parity.rs`) を対象に加えた
# `paths` を law.rs だけに絞っていたため、監査 Law を足した push では 1 件も測って
# いなかった ⚠️ 期待値が 0 の試験しか無いと `got - value` の差の取り方を変える変異が
# 恒等になるので、非零の期待値と許容差の試験を対で置いている
#
# continue-on-error は compile error も green に潰すので
# continue-on-error は使わない measurement の exit code (2 = missed、3 =
# timeout) は受けてから中身で判定する
#
# 1 mutant ≈ 6 s build + 55 s test なので **全 push では回さない**: 判定器
# (law.rs と判定器 test) を触った push / 同 PR / 週次 / 手動 4 shard 並列で
# 1 shard 30-40 分
#
# 2026-09-30: `push` を追加した それまでは `pull_request` / `schedule` /
# `workflow_dispatch` だけだったが、**本 repo の既定運用は main 直 push なので
# `pull_request` が事実上発火せず、実効 gate が週次 cron だけ**になっていた
# 実測: `law.rs` に判定経路 (`hard_verdict`) を足して `--re` にも登録した
# commit (`7faf75b`) が、mutants の測定を 1 度も通らずに main に載った
# `paths` が判定器に限定されているので、doc や無関係な src の push では発火しない
name: Quality Deep

on:
  schedule:
    - cron: '0 18 * * 0' # 日曜 03:00 JST
  workflow_dispatch:
  # ⚠️ push と pull_request の paths は必ず同じ内容にする (片方だけに足すと
  # 「PR では測るのに直 push では測らない」= 元の穴が片側に残る)
  push:
    branches: [main]
    paths:
      - 'alice-lol/src/law.rs'
      - 'alice-lol/src/audit_law.rs'
      - 'alice-lol/src/law_id.rs'
      - 'alice-lol/tests/analytic_law.rs'
      - 'alice-lol/tests/law_tests.rs'
      - 'alice-lol/tests/law_corpus_oracle.rs'
      - 'alice-lol/tests/audit_law_parity.rs'
      - 'alice-lol/tests/law_id_oracle.rs'
      - '.cargo/mutants.toml'
      - '.github/workflows/quality-deep.yml'
  pull_request:
    branches: [main]
    paths:
      - 'alice-lol/src/law.rs'
      - 'alice-lol/src/audit_law.rs'
      - 'alice-lol/src/law_id.rs'
      - 'alice-lol/tests/analytic_law.rs'
      - 'alice-lol/tests/law_tests.rs'
      - 'alice-lol/tests/law_corpus_oracle.rs'
      - 'alice-lol/tests/audit_law_parity.rs'
      - 'alice-lol/tests/law_id_oracle.rs'
      - '.cargo/mutants.toml'
      - '.github/workflows/quality-deep.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutation testing (law cores, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      # ci.yml と同じ multi-repo checkout (alice-lol は sibling の
      # 実 API を無条件 use するので stub では compile できない)
      - uses: actions/checkout@v5
        with:
          path: ALICE-LOL
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      # research_law が使う alice-zip (path dep `../../ALICE-Zip`)
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LLM
          path: ALICE-LLM

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Kinematics
          path: ALICE-Kinematics

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Physics
          path: ALICE-Physics

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-LOL

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants

      # `--in-place` は multi-repo layout で必須 (tree copy すると `../../ALICE-SDF`
      # 等の sibling path dep が切れる)
      # in-place は tree を書き換えるので並列不可 — `--jobs` と併用すると
      # cargo-mutants 自身が usage error で落ちる (2026-09-27 実測)
      # test 集合は判定器を動かすものだけ (`--lib` が law.rs 内 `core_probe_tests`)
      - name: Mutants (law cores, shard ${{ matrix.shard }}/4)
        working-directory: ALICE-LOL
        run: |
          # 変異した `const fn` が rustc の const-eval を無限ループさせ、
          # test timeout が効かないまま runner が OOM で死ぬ
          ulimit -v 6291456
          set +e
          # `--output DIR` は **DIR の中に mutants.out を作る** ので、指定すると
          # 結果は mutants.out/mutants.out/ に落ちる 既定 (workspace 直下の
          # mutants.out) に任せて、下の gate と path を一致させる
          # (2026-09-27 run 36325718354: gate が mutants.out/missed.txt を見て
          #  いたが実体は mutants.out/mutants.out/missed.txt にあり、生存変異
          #  22 件を抱えたまま 4 shard 全部が success = false green だった)
          cargo mutants --in-place --shard ${{ matrix.shard }}/4 \
            --timeout 300 --build-timeout 240 \
            --file alice-lol/src/law.rs \
            --file alice-lol/src/audit_law.rs \
            --file alice-lol/src/law_id.rs \
            --re 'probe_ball|probe_pair|gap_exceeds|contact_upper_bound|interval_sign|box_expand|box_children|box_nearest|thickness_verdict|pair_verdict|check_min_thickness|check_non_overlap|check_containment|check_contact|hard_verdict|is_proven|lipschitz_enclosure|refine_with_lipschitz|evaluate|check_evidence|check_ranges|check_expectations|sorted_values|version_key|passed|hex32|nibble|fold_semantics_pins|audit_verdict_order_fingerprint|length_prefixed|LawIdHasher::|AuditLaw::law_id' \
            -- --lib --test analytic_law --test law_tests --test audit_law_parity --test law_id_oracle
          rc=$?
          set -e
          # 0 = 全て caught、2 = missed あり、3 = timeout あり → ここでは測定結果
          # として受け、下の gate で中身を見る それ以外 (4 = baseline red 等) は
          # 「何も測れていない」ので即 fail
          case $rc in 0 | 2 | 3) ;; *) echo "::error::cargo-mutants exit $rc (baseline red or usage error)"; exit $rc ;; esac

      - name: Summary + gate (missed must be 0)
        if: always()
        working-directory: ALICE-LOL
        run: |
          {
            echo "## cargo-mutants — law cores shard ${{ matrix.shard }}/4 (\`law.rs\` + \`audit_law.rs\` + \`law_id.rs\`)"
            if [ -f mutants.out/outcomes.json ]; then
              python3 - <<'PY'
          import json
          d = json.load(open("mutants.out/outcomes.json"))
          s = d.get("summary", d)
          caught, missed = s.get("caught", 0), s.get("missed", 0)
          un, to = s.get("unviable", 0), s.get("timeout", 0)
          tot = caught + missed
          print(f"- caught {caught} / missed {missed} / unviable {un} / timeout {to}")
          print(f"- mutation score: {caught / tot * 100:.1f}%" if tot else "- no viable mutants")
          PY
              echo; echo "### missed"; head -50 mutants.out/missed.txt 2>/dev/null || echo "(none)"
            else
              echo "no output (build failed?)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # 自己検査: gate が「何も検査していないのに通る」のを防ぐ
          # (測定結果が無い = path ミス or build 失敗、どちらも green にしない)
          if [ ! -f mutants.out/outcomes.json ] || [ ! -f mutants.out/missed.txt ]; then
            echo "::error::mutants.out/{outcomes.json,missed.txt} が無い — gate が何も検査していない (path 指定 or build を確認)"
            find mutants.out -maxdepth 3 2>/dev/null | head -40
            exit 1
          fi
          if ! grep -q '"caught"' mutants.out/outcomes.json; then
            echo "::error::outcomes.json に caught が無い — 測定が成立していない"
            exit 1
          fi
          # gate: 判定器の生存変異は 0 等価 / 未達成は .cargo/mutants.toml で理由付き除外
          if [ -s mutants.out/missed.txt ]; then
            echo "::error::判定器に生存変異あり ($(wc -l < mutants.out/missed.txt) 件) — test を足すか、等価変異なら理由付きで .cargo/mutants.toml に除外を書く"
            cat mutants.out/missed.txt
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutants-law-shard-${{ matrix.shard }}
          path: ALICE-LOL/mutants.out
          if-no-files-found: ignore
          retention-days: 14
