[package]
name = "alice-world-auditor"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "ALICE World Auditor — deterministic planner over alice-physics worlds, IDA* search against a Law-checked Goal, 3-valued (proven/violated/undecided) verdicts"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
repository = "https://github.com/ext-sakamoro/ALICE-LOL"
homepage = "https://github.com/ext-sakamoro/ALICE-LOL"
documentation = "https://docs.rs/alice-world-auditor"
readme = "README.md"
keywords = ["world-model", "planning", "search", "verification", "deterministic"]
categories = ["mathematics", "game-development"]

[dependencies]
alice-world-auditor-types = { path = "../alice-world-auditor-types", version = "0.1.0" }
alice-sdf = { path = "../../ALICE-SDF", version = "4.0.0", default-features = false, features = ["glsl"] }
glam = "0.29"
# Optional; only pulled in when `physics` is enabled. NOTE: alice-physics is
# AGPL-3.0-or-later OR LicenseRef-Commercial — enabling `physics` keeps the
# same license family this crate already carries (unlike alice-lol, which is
# MIT/Apache-2.0 and must leave this feature off to stay permissive).
# Both ALICE-SDF and ALICE-Physics are already checked out by ALICE-LOL's
# existing CI (alice-lol itself has identical path deps to these siblings),
# so no new CI checkout step is needed (feedback_ci_workspace_transitive_path_dep).
alice-physics = { path = "../../ALICE-Physics", version = "1.0", default-features = false, features = ["std"], optional = true }

[features]
default = []
physics = ["dep:alice-physics"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = "deny"
nursery = "deny"

[[example]]
name = "plan_rest_to_rest"
required-features = ["physics"]
