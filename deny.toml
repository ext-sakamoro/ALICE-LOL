# cargo-deny 設定 (v0.14+ schema)
# ALICE-* 共通の CI 構成
# ALICE-LOL の全 crate は LicenseRef-Proprietary (publish = false)
# allow の MIT 等は依存 crate のための行で、本 crate の license とは別

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # unmaintained warnings (informational only、CVE ではない) — alice-sdf 経由の transitive dep
    "RUSTSEC-2025-0141",  # bincode 2.x unmaintained: alice-sdf の asdf / mesh I/O、代替は wire format 別
    "RUSTSEC-2024-0436",  # paste 1.0.15 unmaintained: pyo3-macros 経由、除去不能
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
]

# this crate is publish = false and LicenseRef-Proprietary: unpublished
# workspace crates are not checked against the allow list
[licenses.private]
ignore = true

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
version = "*"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/ext-sakamoro/ALICE-SDF", "https://github.com/ext-sakamoro/ALICE-Zip"]

[sources.allow-org]

# CI (security-audit.yml) and the local preflight both check out the real sibling
# crates next to this repo; each exception allows the licence its crate declares
# (ALICE-LLM is pinned before its licence became LicenseRef-Proprietary)
[[licenses.exceptions]]
name = "alice-llm"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

