rance, residual rms), only compared) is tested through ingest with a NaN, +0 and -0 tolerance on a refitted law's own evidence (tests/analytic_research_law.rs ingest_with_a_nan_tolerance_keeps_the_residual_band; measured mutant: max64 without the NaN rule makes the NaN case Breaks); the zero sign of the band is not observable because the band is only compared. The runtime parser count (runtime_parser.rs count, max(v.round(), 1.0) then a u32 cast) has no reachable tie: the floor is the literal 1.0 and a non-finite count is refused before the max (parser_count_of_negative_zero_is_the_floor_and_non_finite_is_refused). The law verdict internals (law.rs) are submitted as equivalence notes, read from the source on 2026-10-18, pending an independent check: surface_distance (field = |f(p)|, so never -0; cap and r are floored by f32::EPSILON and cap * 1e-3 > 0, so no equal-zero pair reaches the max / min; a NaN field takes the floor, the documented fallback), refine_with_lipschitz (the tightened bounds max(iv.lo, e.lo) / min(iv.hi, e.hi) are only compared: lo > hi, interval_sign, tight.lo > 0.0, ia.lo >= 0.0, so the zero sign is not observable; a NaN enclosure is refused before by lipschitz_enclosure's finiteness checks), check_non_overlap (the evidence ranking max(fa, fb) runs only when fa < 0 and fb < 0, so neither a zero nor a NaN operand reaches it), contact_upper_bound (max(max_distance, min_distance) + cell_diag with cell_diag > 0, so a zero sign is erased; a NaN max_distance is not refused by LawSet::contact, a separate input-validation gap), material_fraction (max(1 - z * z, 0) over constant Fibonacci points with |z| < 1: no input reaches it) and solve_peak_temperature (min(dt_max * 0.5, duration_s) with dt_max finite and > 0; a zero duration of either sign gives a NaN step count that casts to 0 steps). Missing for pass: the independent check of these notes and of the stdlib / export / parser notes above, then the tie_tests field"
