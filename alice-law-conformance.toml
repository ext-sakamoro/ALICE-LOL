# ALICE-Law conformance manifest for this crate (alice-lol). One entry per
# gate defined in ALICE-Law's conformance/gates.toml. Schema (status /
# evidence / mutant / since / note / reference_repo) is docs/CONFORMANCE.md's
# "Manifest" section in that repository; a `pass` entry also names the red
# mutant that turns the evidence red, as carried out in this crate.
#
# Entries here are written from what this repository's own commits, CI
# workflow and test suite show at origin/main, re-measured directly rather
# than assumed: a gate whose evidence or mutant is not shown is `unverified`
# (with what is missing), a gate checked and unmet is `fail-known` (with the
# site), and nothing is guessed `pass`. Library code means the workspace
# members' src/ (alice-lol and alice-lol-macro are the published crates).

