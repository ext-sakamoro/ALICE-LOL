# ALICE-Law conformance manifest for this crate (alice-lol). One entry per
# gate defined in ALICE-Law's conformance/gates.toml. Schema (status /
# evidence / since / note / reference_repo) is docs/CONFORMANCE.md's
# "Manifest" section in that repository.
#
# Entries here are written from what this repository's own commits, CI
# workflow and test suite actually show, checked directly rather than
# assumed: a gate checked and unmet is `fail-known`, one not checked is
# `unverified`, and a `pass` names its evidence and the mutant that was run.

