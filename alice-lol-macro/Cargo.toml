[package]
name = "alice-lol-macro"
version = "0.4.0"
edition = "2021"
rust-version = "1.90"
description = "LOL (Law-Oriented Language) proc_macro — parses LOL DSL, emits SdfNode construction code"
license = "Apache-2.0"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
repository = "https://github.com/ext-sakamoro/ALICE-LOL"
homepage = "https://github.com/ext-sakamoro/ALICE-LOL"
documentation = "https://docs.rs/alice-lol-macro"
readme = "README.md"
keywords = ["dsl", "proc-macro", "sdf", "geometry", "distance-field"]
categories = ["graphics", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
# the identifier test hashes the probe expansions (not a dependency of the macro itself)
sha2 = { version = "0.10", default-features = false }
